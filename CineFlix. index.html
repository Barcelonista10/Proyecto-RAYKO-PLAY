<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vea Diferente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050507;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== FONDO CON LUZ AMBIENTE ========== */
    body::before {
      content: '';
      position: fixed;
      inset: -20%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(40% 35% at 20% 15%, rgba(56, 189, 248, 0.14), transparent 70%),
        radial-gradient(35% 30% at 85% 70%, rgba(99, 102, 241, 0.12), transparent 70%);
      animation: ambientDrift 18s ease-in-out infinite alternate;
    }
    @keyframes ambientDrift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(-4%, 5%, 0) scale(1.12); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .glass-panel {
      background: rgba(20, 22, 29, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ========== TARJETAS DE CANAL ========== */
    .channel-box {
      background: linear-gradient(145deg, #12151E 0%, #0A0C10 100%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
    }
    .channel-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.10) 50%, transparent 65%);
      transform: translateX(-120%);
      pointer-events: none;
    }
    .channel-box:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.35);
    }
    .channel-box:hover::after {
      transform: translateX(120%);
      transition: transform 0.7s ease;
    }
    .channel-box i, .channel-box .icon-pop {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .channel-box:hover i, .channel-box:hover .icon-pop {
      transform: scale(1.18) rotate(-6deg);
    }

    /* ========== EFECTO PRESIÓN Y ONDA EN BOTONES ========== */
    button, .channel-box, .fx {
      transition-property: scale, transform, background-color, color, border-color, box-shadow, opacity;
      transition-duration: 0.2s;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    button:active, .channel-box:active, .fx:active {
      scale: 0.94;
    }
    .ripple-wave {
      position: absolute;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.38);
      transform: scale(0);
      animation: ripple 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(1); opacity: 0; }
    }

    /* ========== ANIMACIONES BASE ========== */
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }
    .live-pulse {
      animation: pulseDot 1.4s infinite ease-in-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal {
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(min(var(--i, 0), 10) * 60ms);
    }

    /* Cambio de pestaña */
    #tab-inicio:not(.hidden), #tab-canales:not(.hidden) {
      animation: fadeUp 0.35s ease-out both;
    }

    /* Buscador y aviso */
    @keyframes overlayIn {
      from { opacity: 0; backdrop-filter: blur(0); }
      to   { opacity: 1; }
    }
    #search-overlay:not(.hidden) { animation: overlayIn 0.25s ease-out both; }
    #search-overlay:not(.hidden) .max-w-lg { animation: fadeUp 0.35s 0.05s cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -16px) scale(0.9); }
      to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
    #toast-msg:not(.hidden) { animation: toastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* Submenú de señales */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .submenu:not(.hidden) { animation: slideDown 0.25s ease-out both; }
    .submenu:not(.hidden) .signal-item {
      animation: fadeUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--s, 0) * 50ms);
    }

    /* Tarjetas de partido */
    .match-card {
      transition: border-color 0.25s, box-shadow 0.25s, background-color 0.25s;
    }
    .match-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 28px -14px rgba(56, 189, 248, 0.45);
    }
    .signal-item { position: relative; overflow: hidden; }
    .signal-item:hover { translate: 4px 0; }

    /* ========== CARRUSEL ========== */
    @keyframes kenBurns {
      from { scale: 1; }
      to   { scale: 1.1; }
    }
    .hero-slide.active img {
      animation: kenBurns 6s ease-out both;
    }
    #hero-progress {
      position: absolute;
      left: 0; bottom: 0;
      height: 3px;
      width: 100%;
      transform-origin: left;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      z-index: 11;
      animation: heroProgress 4s linear forwards;
    }
    @keyframes heroProgress {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    #hero-wrap {
      transition: box-shadow 0.4s;
    }
    #hero-wrap:hover {
      box-shadow: 0 20px 50px -20px rgba(56, 189, 248, 0.5);
    }

    /* ========== ENCABEZADO ========== */
    .app-header {
      transition: box-shadow 0.3s, border-color 0.3s;
      border-bottom: 1px solid transparent;
    }
    .app-header.scrolled {
      box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.9);
      border-bottom-color: rgba(255, 255, 255, 0.06);
    }

    /* ========== NAVEGACIÓN INFERIOR ========== */
    .nav-btn.nav-on {
      background: #fff;
      color: #000;
      box-shadow: 0 6px 18px -6px rgba(255, 255, 255, 0.45);
    }

    /* ========== BUSCADOR ========== */
    #global-search-input {
      transition: box-shadow 0.25s, border-color 0.25s;
    }
    #global-search-input:focus {
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
    }

    /* ========== CARGA (SKELETON) ========== */
    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 1rem;
      height: 68px;
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.08) 50%, transparent 80%);
      transform: translateX(-100%);
      animation: shimmer 1.3s infinite;
    }
    @keyframes shimmer {
      to { transform: translateX(100%); }
    }

    /* ========== ACCESIBILIDAD ========== */
    :focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen pb-32 selection:bg-sky-500 selection:text-black">

  <div class="max-w-lg mx-auto min-h-screen flex flex-col relative">

    <!-- Header -->
    <header id="app-header" class="app-header px-5 pt-6 pb-4 flex items-center justify-between sticky top-0 z-30 bg-[#050507]/85 backdrop-blur-lg">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-6 rounded-full bg-gradient-to-b from-sky-400 to-blue-600"></span>
          <h1 class="text-xl font-extrabold tracking-tight text-white">Vea Diferente</h1>
        </div>
        <p id="today-date" class="text-xs text-zinc-400 mt-0.5 pl-4"></p>
      </div>

      <button onclick="openSearchOverlay()" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-zinc-300 hover:text-white hover:border-sky-400/40 active:scale-95 transition">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </button>
    </header>

    <!-- INICIO -->
    <main id="tab-inicio" class="px-5 space-y-7 flex-grow">

      <!-- Carrusel destacado -->
      <div id="hero-wrap" class="reveal relative rounded-3xl overflow-hidden border border-white/10 shadow-2xl h-56 group select-none">
        <div id="hero-carousel-track" class="flex h-full transition-transform duration-500 ease-out"></div>

        <button onclick="prevHeroSlide(event)" class="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/50 backdrop-blur-md text-white/80 hover:text-white hover:bg-sky-500/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-20">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button onclick="nextHeroSlide(event)" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-black/50 backdrop-blur-md text-white/80 hover:text-white hover:bg-sky-500/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-20">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>

        <div id="hero-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-20"></div>
        <div id="hero-progress"></div>
      </div>

      <!-- Canales destacados -->
      <section class="reveal" style="--i:2">
        <div class="flex items-center justify-between mb-3.5">
          <h2 class="text-base font-bold text-white">Canales Destacados</h2>
          <button onclick="switchBottomTab('canales')" class="text-xs font-semibold text-sky-400 hover:underline">Ver todos</button>
        </div>

        <div class="grid grid-cols-4 gap-2.5">
          <div onclick="openChannel(0)" class="channel-box reveal rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer aspect-square" style="--i:3">
            <div class="icon-pop grid grid-cols-2 gap-1 w-7 h-7 mb-2">
              <span class="border border-sky-400 rounded-[3px]"></span>
              <span class="border border-sky-400 rounded-[3px]"></span>
              <span class="border border-sky-400 rounded-[3px]"></span>
              <span class="border border-sky-400 rounded-[3px]"></span>
            </div>
            <span class="text-[10px] font-bold tracking-tight text-zinc-200 leading-none">MULTI-CAM</span>
          </div>

          <div onclick="openChannel(1)" class="channel-box reveal rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer aspect-square" style="--i:4">
            <div class="w-8 h-8 rounded-full bg-emerald-500/15 border border-emerald-400/40 flex items-center justify-center mb-2">
              <i class="fa-solid fa-futbol text-emerald-400 text-sm"></i>
            </div>
            <span class="text-[10px] font-bold tracking-tight text-zinc-200 leading-none">NACIONAL</span>
          </div>

          <div onclick="openChannel(2)" class="channel-box reveal rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer aspect-square" style="--i:5">
            <div class="w-8 h-8 rounded-full bg-indigo-500/15 flex items-center justify-center mb-2">
              <i class="fa-brands fa-discord text-indigo-400 text-base"></i>
            </div>
            <span class="text-[10px] font-bold tracking-tight text-zinc-200 leading-none">COMUNIDAD</span>
          </div>

          <div onclick="openChannel(3)" class="channel-box reveal rounded-2xl p-3 flex flex-col items-center justify-center text-center cursor-pointer aspect-square" style="--i:6">
            <div class="icon-pop w-8 h-8 rounded-full bg-red-500/15 flex items-center justify-center mb-2">
              <span class="text-lg font-black italic text-red-500">Z</span>
            </div>
            <span class="text-[10px] font-bold tracking-tight text-zinc-200 leading-none">ZONA Z</span>
          </div>
        </div>
      </section>

      <!-- Agenda -->
      <section class="space-y-3 reveal" style="--i:7">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold text-white">Agenda Deportiva</h2>
          <div class="flex gap-1.5">
            <button onclick="filterList('all', this)" class="filter-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white text-black transition">Todo</button>
            <button onclick="filterList('live', this)" class="filter-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-zinc-900 text-zinc-400 transition">En Vivo</button>
          </div>
        </div>

        <div id="matches-container" class="space-y-2.5"></div>
      </section>

    </main>

    <!-- CANALES -->
    <main id="tab-canales" class="hidden px-5 space-y-5 flex-grow">
      <div>
        <h2 class="text-xl font-extrabold text-white">Elige el canal que quieras ver:</h2>
        <p class="text-xs text-zinc-400 mt-1">Selecciona cualquier señal para abrir el reproductor</p>
      </div>

      <div id="all-channels-grid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <!-- Navegación inferior -->
    <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass-panel rounded-2xl p-1.5 flex items-center justify-around z-30 shadow-2xl">
      <button id="nav-inicio" onclick="switchBottomTab('inicio')" class="nav-btn nav-on flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 text-zinc-400">
        <i class="fa-solid fa-house"></i> Inicio
      </button>
      <button id="nav-canales" onclick="switchBottomTab('canales')" class="nav-btn flex-1 py-2.5 rounded-xl text-zinc-400 hover:text-white font-bold text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-tv"></i> Canales
      </button>
      <button onclick="openSearchOverlay()" class="nav-btn flex-1 py-2.5 rounded-xl text-zinc-400 hover:text-white font-bold text-xs flex items-center justify-center gap-2">
        <i class="fa-solid fa-search"></i> Buscar
      </button>
    </nav>

  </div>

  <!-- Búsqueda -->
  <div id="search-overlay" class="fixed inset-0 z-40 hidden bg-black/95 backdrop-blur-xl p-5">
    <div class="max-w-lg mx-auto space-y-4">
      <div class="flex items-center gap-3">
        <div class="relative flex-grow">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
          <input id="global-search-input" oninput="handleGlobalSearch()" type="text" placeholder="Buscar partido, equipo o canal..." class="w-full bg-zinc-900 border border-zinc-800 focus:border-sky-500 rounded-2xl py-3 pl-11 pr-4 text-sm text-white outline-none">
        </div>
        <button onclick="closeSearchOverlay()" class="text-sm font-semibold text-zinc-400 hover:text-white px-2">Cerrar</button>
      </div>
      <div id="search-results" class="space-y-2.5 pt-2"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-msg" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 hidden glass-panel px-4 py-2.5 rounded-full text-xs font-semibold text-white shadow-xl border border-sky-400/30 flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-sky-400 live-pulse"></span>
    <span id="toast-text">Abriendo señal...</span>
  </div>

  <script>
    /* ========== FIX WEBVIEW ==========
       Los enlaces con target="_blank" no abren dentro de un WebView.
       Este manejador los fuerza a abrir en la misma ventana, así pasan
       por shouldOverrideUrlLoading de la app (ExoPlayer, etc.). */
    document.addEventListener('click', function (e) {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href === '#' || href.startsWith('javascript:')) return;
      if (a.getAttribute('target') === '_blank') {
        e.preventDefault();
        window.location.href = a.href;
      }
    });

    /* ========== EFECTO ONDA (RIPPLE) EN BOTONES Y TARJETAS ========== */
    document.addEventListener('pointerdown', function (e) {
      const el = e.target.closest('button, .channel-box, .fx');
      if (!el) return;

      if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
      el.style.overflow = 'hidden';

      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const wave = document.createElement('span');
      wave.className = 'ripple-wave';
      wave.style.width = wave.style.height = size + 'px';
      wave.style.left = (e.clientX - rect.left - size / 2) + 'px';
      wave.style.top = (e.clientY - rect.top - size / 2) + 'px';
      el.appendChild(wave);
      wave.addEventListener('animationend', () => wave.remove());
    }, { passive: true });

    /* Sombra del encabezado al hacer scroll */
    window.addEventListener('scroll', () => {
      document.getElementById('app-header')
        .classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    // Fecha de hoy automática
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });

    /* ========== DATOS ========== */
    const heroEvents = [
      {
        title: 'PSG vs Roma',
        subtitle: 'Jornada 5 • Disney 7 HD',
        badge: 'HOY 15:00',
        league: 'UEFA Champions League 🇪🇺',
        scoreOrTime: 'Comienza en breve',
        image: 'https://sportal365images.com/process/smp-images-production/record.mx/24112026/a29b198d-5cae-46c7-b4f9-a0b8b7e97bba.jpg',
        url: 'https://streamx723.sbs/global1.php?channel=disney7'
      },
      {
        title: 'Club Brugge vs Liverpool',
        subtitle: 'Jornada 5 • TNT 2 UK (DRM)',
        badge: 'HOY 15:00',
        league: 'UEFA Champions League 🇪🇺',
        scoreOrTime: 'Comienza en breve',
        image: 'https://sportal365images.com/process/smp-images-production/record.mx/25112026/d09e521a-128b-470f-bb42-0acf1fbf31a3.jpg?operations=autocrop(960:540)&format=webp',
        url: 'https://streamx723.sbs/channel/tnt2uk.html'
      },
      {
        title: 'Sporting CP vs Manchester United',
        subtitle: 'Jornada 5 • Disney 9 HD',
        badge: 'HOY 15:00',
        league: 'UEFA Champions League 🇪🇺',
        scoreOrTime: 'Comienza en breve',
        image: 'https://sportal365images.com/process/smp-images-production/record.mx/25112026/c320e4b5-38ff-4d98-a785-d10d98ddd7f8.jpg',
        url: 'https://streamx723.sbs/global1.php?channel=disney9'
      }
    ];

    /* ========== EVENTOS DESDE JSON REMOTO ========== */
    const EVENTS_JSON_URL = 'https://televiax.alwaysdata.net/susen/eventos_diarios.json';
    let matches = [];
    let currentMatchFilter = 'all';

    // Convierte "Equipo A vs Equipo B" en los dos nombres que usa la interfaz.
    function splitMatchTitle(title) {
      const parts = String(title || '').split(/\s+vs\.?\s+/i);
      return {
        teamA: (parts[0] || 'Por definir').trim(),
        // Si el JSON incluye un tercer segmento como "Por definir",
        // se ignora y solo se muestran los dos equipos.
        teamB: (parts[1] || 'Por definir').trim()
      };
    }

    function normalizeRemoteMatches(data) {
      if (!Array.isArray(data)) {
        throw new Error('El JSON remoto no contiene una lista de eventos.');
      }

      return data.map((event, index) => {
        const teams = splitMatchTitle(event.title);
        const remoteChannels = Array.isArray(event.canales) ? event.canales : [];

        return {
          id: index + 1,
          live: false,
          time: String(event.time || ''),
          league: String(event.league || 'Evento deportivo'),
          teamA: teams.teamA,
          teamB: teams.teamB,
          flag: '',
          icon: String(event.icon || ''),
          signals: remoteChannels.map((channel, channelIndex) => ({
            name: `Señal ${channelIndex + 1} • ${String(channel.canal || 'Canal')}`,
            lang: '',
            quality: '',
            url: String(channel.url || ''),
            actividad: String(channel.actividad || '')
          })).filter(signal => signal.url)
        };
      });
    }

    async function loadRemoteMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

      try {
        const response = await fetch(EVENTS_JSON_URL, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Error HTTP ${response.status}`);
        }

        const data = await response.json();
        matches = normalizeRemoteMatches(data);
        renderMatches(currentMatchFilter === 'live'
          ? matches.filter(match => match.live)
          : matches);

        // Si la búsqueda está abierta, actualiza sus resultados con los datos nuevos.
        const searchInput = document.getElementById('global-search-input');
        if (searchInput && searchInput.value.trim()) handleGlobalSearch();
      } catch (error) {
        console.error('No se pudo cargar el JSON de eventos:', error);
        matches = [];
        container.innerHTML = `
          <div class="glass-panel rounded-2xl p-4 text-center reveal">
            <p class="text-sm font-bold text-white">No se pudo cargar la agenda</p>
            <p class="text-xs text-zinc-400 mt-1">Comprueba tu conexión e inténtalo de nuevo.</p>
            <button onclick="loadRemoteMatches()" class="mt-3 px-4 py-2 rounded-xl bg-sky-500 text-black text-xs font-bold">Reintentar</button>
          </div>`;
      }
    }

    /* Cada canal tiene "url". Pega aquí el enlace de cada señal.
       Si queda vacío, se muestra el aviso "Asigna una URL". */
    const channels = [
      { name: 'MULTI-CAM',        desc: '4 Cámaras en Vivo',        icon: 'fa-table-cells-large', color: 'text-sky-400',     multi: true,  url: '' },
      { name: 'PRIMERA NACIONAL', desc: 'Fútbol Argentino',         icon: 'fa-futbol',            color: 'text-emerald-400', multi: false, url: '' },
      { name: 'COMUNIDAD VIP',    desc: 'Watch Party Discord',      icon: 'fa-brands fa-discord', color: 'text-indigo-400',  multi: false, url: '' },
      { name: 'ZONA ANIME Z',     desc: 'Transmisión 24/7',         icon: 'fa-bolt',              color: 'text-red-500',     multi: false, url: '' },
      { name: 'WIN SPORTS +',     desc: 'Fútbol Colombiano',        icon: 'fa-trophy',            color: 'text-amber-400',   multi: false, url: 'https://streamx723.sbs/global1.php?channel=winplus' },
      { name: 'ESPN PREMIUM',     desc: 'Deportes Internacionales', icon: 'fa-tv',                color: 'text-rose-400',    multi: false, url: 'https://streamx723.sbs/global1.php?channel=espnpremium' }
    ];

    /* ========== CARRUSEL ========== */
    let currentHeroIndex = 0;
    let heroAutoInterval;

    function initHeroCarousel() {
      const track = document.getElementById('hero-carousel-track');
      const dots = document.getElementById('hero-dots');

      track.innerHTML = heroEvents.map((ev, i) => `
        <a href="${ev.url || '#'}" ${ev.url ? '' : `onclick="event.preventDefault(); showToast('Asigna una URL para: ${ev.title}')"`}
           class="hero-slide ${i === 0 ? 'active' : ''} min-w-full h-full relative cursor-pointer flex flex-col justify-between p-5 block overflow-hidden">
          <img src="${ev.image}"
               onerror="this.src='https://placehold.co/900x500/0f172a/38bdf8?text=Vea+Diferente+En+Vivo'"
               alt="${ev.title}"
               class="absolute inset-0 w-full h-full object-cover object-center">

          <div class="absolute inset-0 bg-gradient-to-t from-[#050507] via-[#050507]/60 to-black/30"></div>

          <div class="relative z-10 flex items-center justify-between">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-600/90 text-white text-[10px] font-extrabold tracking-wide shadow-lg">
              <span class="w-1.5 h-1.5 rounded-full bg-white live-pulse"></span> ${ev.badge}
            </span>
            <span class="px-2.5 py-1 rounded-full bg-black/50 backdrop-blur-md text-xs font-semibold text-zinc-200">
              ${ev.league}
            </span>
          </div>

          <div class="relative z-10 pb-3 flex items-end justify-between gap-3">
            <div>
              <p class="text-xs font-bold text-sky-400 mb-0.5">${ev.scoreOrTime}</p>
              <h2 class="text-lg font-extrabold text-white leading-tight drop-shadow">${ev.title}</h2>
              <p class="text-[11px] text-zinc-300 mt-0.5">${ev.subtitle}</p>
            </div>
            <span class="w-10 h-10 shrink-0 rounded-full bg-white text-black flex items-center justify-center shadow-lg group-hover:bg-sky-400 transition">
              <i class="fa-solid fa-play text-xs ml-0.5"></i>
            </span>
          </div>
        </a>
      `).join('');

      dots.innerHTML = heroEvents.map((_, idx) => `
        <button onclick="goToHeroSlide(${idx}, event)"
                class="hero-dot h-1.5 rounded-full transition-all duration-300 ${idx === 0 ? 'w-5 bg-sky-400' : 'w-1.5 bg-white/40'}">
        </button>
      `).join('');

      startHeroAutoPlay();
    }

    function restartHeroProgress() {
      const bar = document.getElementById('hero-progress');
      if (!bar) return;
      bar.style.animation = 'none';
      void bar.offsetWidth; // reinicia la animación
      bar.style.animation = '';
    }

    function updateHeroSlide() {
      const track = document.getElementById('hero-carousel-track');
      track.style.transform = `translateX(-${currentHeroIndex * 100}%)`;
      document.querySelectorAll('.hero-slide').forEach((s, idx) => {
        s.classList.toggle('active', idx === currentHeroIndex);
      });
      document.querySelectorAll('.hero-dot').forEach((dot, idx) => {
        dot.className = `hero-dot h-1.5 rounded-full transition-all duration-300 ${idx === currentHeroIndex ? 'w-5 bg-sky-400' : 'w-1.5 bg-white/40'}`;
      });
      restartHeroProgress();
    }

    function nextHeroSlide(e) {
      if (e) e.stopPropagation();
      currentHeroIndex = (currentHeroIndex + 1) % heroEvents.length;
      updateHeroSlide();
      resetHeroAutoPlay();
    }

    function prevHeroSlide(e) {
      if (e) e.stopPropagation();
      currentHeroIndex = (currentHeroIndex - 1 + heroEvents.length) % heroEvents.length;
      updateHeroSlide();
      resetHeroAutoPlay();
    }

    function goToHeroSlide(index, e) {
      if (e) e.stopPropagation();
      currentHeroIndex = index;
      updateHeroSlide();
      resetHeroAutoPlay();
    }

    function startHeroAutoPlay() {
      heroAutoInterval = setInterval(() => {
        currentHeroIndex = (currentHeroIndex + 1) % heroEvents.length;
        updateHeroSlide();
      }, 4000);
    }

    function resetHeroAutoPlay() {
      clearInterval(heroAutoInterval);
      startHeroAutoPlay();
    }

    /* Deslizar con el dedo en el carrusel */
    (function enableHeroSwipe() {
      const wrap = document.getElementById('hero-wrap');
      let startX = 0;
      wrap.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
      wrap.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) dx < 0 ? nextHeroSlide() : prevHeroSlide();
      }, { passive: true });
    })();

    /* ========== AGENDA ========== */
    function renderMatches(items) {
      const container = document.getElementById('matches-container');
      container.innerHTML = items.map((m, idx) => `
        <div class="match-card reveal glass-panel rounded-2xl overflow-hidden border border-white/10" style="--i:${idx}">
          <div onclick="toggleMatchSubmenu(${m.id})"
               class="fx p-4 flex items-center gap-3 cursor-pointer hover:bg-white/[0.03] transition">

            <div class="w-[58px] shrink-0 text-center">
              ${m.live
                ? `<span class="text-[10px] font-extrabold text-rose-500 block leading-tight">EN<br>VIVO</span>`
                : `<span class="inline-block whitespace-nowrap text-xs font-bold text-zinc-300 bg-zinc-800 px-2 py-1 rounded-lg">${m.time}</span>`
              }
            </div>

            <div class="h-8 w-[1px] bg-zinc-800 shrink-0"></div>

            <div class="min-w-0 flex-1">
              <p class="text-[11px] text-zinc-400 font-medium truncate">${m.league} ${m.flag}</p>
              <p class="text-sm font-bold text-white mt-0.5 leading-snug break-words">
                ${m.teamA} <span class="text-zinc-500 font-normal mx-0.5">vs</span> ${m.teamB}
              </p>
            </div>

            <div id="chevron-match-${m.id}" class="w-7 h-7 shrink-0 rounded-full bg-white/5 flex items-center justify-center text-zinc-400 transition-transform duration-300">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>

          <div id="submenu-match-${m.id}" class="submenu hidden bg-black/40 border-t border-white/5 px-4 py-3 space-y-2">
            <p class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Señales disponibles (${m.signals.length}):</p>
            ${m.signals.length ? m.signals.map((sig, si) => `
              <a href="${sig.url}" style="--s:${si}"
                 class="signal-item fx w-full flex items-center justify-between p-3 rounded-xl bg-zinc-900/90 hover:bg-sky-500/15 border border-white/5 hover:border-sky-400/40 text-left transition group">
                <div class="flex items-center gap-2.5 min-w-0 pr-2">
                  <span class="w-2 h-2 shrink-0 rounded-full ${m.live ? 'bg-rose-500 live-pulse' : 'bg-sky-400'}"></span>
                  <p class="text-xs font-bold text-white group-hover:text-sky-300 transition truncate">${sig.name}</p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  ${sig.quality ? `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded bg-white/10 text-zinc-200">${sig.quality}</span>` : ''}
                  <i class="fa-solid fa-play text-[10px] text-sky-400 group-hover:translate-x-0.5 transition"></i>
                </div>
              </a>
            `).join('') : '<p class="text-xs text-zinc-500 py-2">No hay señales disponibles.</p>'}
          </div>
        </div>
      `).join('');
    }

    function toggleMatchSubmenu(id) {
      const targetMenu = document.getElementById(`submenu-match-${id}`);
      const targetChevron = document.getElementById(`chevron-match-${id}`);
      const isHidden = targetMenu.classList.contains('hidden');

      document.querySelectorAll('[id^="submenu-match-"]').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('[id^="chevron-match-"]').forEach(el => el.style.transform = 'rotate(0deg)');

      if (isHidden) {
        targetMenu.classList.remove('hidden');
        targetChevron.style.transform = 'rotate(180deg)';
      }
    }

    /* ========== CANALES ========== */
    function renderAllChannels() {
      const grid = document.getElementById('all-channels-grid');
      grid.innerHTML = channels.map((c, i) => `
        <div onclick="openChannel(${i})" style="--i:${i}"
             class="channel-box reveal rounded-3xl p-5 flex flex-col items-center justify-center text-center cursor-pointer">
          <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center mb-3">
            <i class="fa-solid ${c.icon} text-2xl ${c.color}"></i>
          </div>
          <h3 class="text-sm font-extrabold text-white">${c.name}</h3>
          <p class="text-[11px] text-zinc-400 mt-1">${c.desc}</p>
        </div>
      `).join('');
    }

    function openChannel(i) {
      const c = channels[i];
      if (c) launchStream(c.name, c.desc, c.multi, c.url);
    }

    function filterList(type, btn) {
      currentMatchFilter = type;
      document.querySelectorAll('.filter-pill').forEach(b => {
        b.className = 'filter-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-zinc-900 text-zinc-400 transition';
      });
      btn.className = 'filter-pill px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white text-black transition';
      renderMatches(type === 'live' ? matches.filter(m => m.live) : matches);
    }

    function switchBottomTab(tab) {
      const inicio = document.getElementById('tab-inicio');
      const canales = document.getElementById('tab-canales');
      const navInicio = document.getElementById('nav-inicio');
      const navCanales = document.getElementById('nav-canales');
      const off = 'nav-btn flex-1 py-2.5 rounded-xl text-zinc-400 hover:text-white font-bold text-xs flex items-center justify-center gap-2';
      const on  = 'nav-btn nav-on flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2';

      if (tab === 'inicio') {
        inicio.classList.remove('hidden');
        canales.classList.add('hidden');
        navInicio.className = on;
        navCanales.className = off;
      } else {
        inicio.classList.add('hidden');
        canales.classList.remove('hidden');
        navCanales.className = on;
        navInicio.className = off;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ========== BÚSQUEDA ========== */
    function openSearchOverlay() {
      document.getElementById('search-overlay').classList.remove('hidden');
      document.getElementById('global-search-input').focus();
      handleGlobalSearch();
    }

    function closeSearchOverlay() {
      document.getElementById('search-overlay').classList.add('hidden');
    }

    function handleGlobalSearch() {
      const q = document.getElementById('global-search-input').value.toLowerCase();
      const res = document.getElementById('search-results');
      const filteredMatches = matches.filter(m =>
        m.teamA.toLowerCase().includes(q) || m.teamB.toLowerCase().includes(q) || m.league.toLowerCase().includes(q));
      const filteredChannels = channels
        .map((c, i) => ({ c, i }))
        .filter(o => o.c.name.toLowerCase().includes(q));

      let n = 0;
      res.innerHTML = [
        ...filteredMatches.map(m => `
          <a href="${(m.signals[0] && m.signals[0].url) || '#'}" onclick="closeSearchOverlay()" style="--i:${n++}" class="fx reveal glass-panel p-3.5 rounded-2xl flex justify-between items-center cursor-pointer block hover:border-sky-400/40 transition">
            <div>
              <span class="text-[10px] text-sky-400 font-bold uppercase">${m.league}</span>
              <p class="text-sm font-bold text-white">${m.teamA} vs ${m.teamB}</p>
            </div>
            <i class="fa-solid fa-play text-xs text-zinc-400"></i>
          </a>
        `),
        ...filteredChannels.map(o => `
          <div onclick="closeSearchOverlay(); openChannel(${o.i})" style="--i:${n++}" class="fx reveal glass-panel p-3.5 rounded-2xl flex justify-between items-center cursor-pointer hover:border-emerald-400/40 transition">
            <div>
              <span class="text-[10px] text-emerald-400 font-bold uppercase">Canal en Vivo</span>
              <p class="text-sm font-bold">${o.c.name}</p>
            </div>
            <i class="fa-solid fa-tv text-xs text-zinc-400"></i>
          </div>
        `)
      ].join('') || '<p class="text-center text-zinc-500 text-sm py-6">Sin resultados</p>';
    }

    /* ========== UTILIDADES ========== */
    let toastTimer;
    function showToast(text) {
      const toast = document.getElementById('toast-msg');
      document.getElementById('toast-text').textContent = text;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function launchStream(title, sub, isMulti, streamUrl = '') {
      if (streamUrl) {
        window.location.href = streamUrl;
      } else {
        showToast(`Asigna una URL para: ${title}`);
      }
    }

    initHeroCarousel();
    loadRemoteMatches();
    renderAllChannels();
  </script>
</body>
</html>
