<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY - Detección Horaria de Eventos</title>
    <!-- FontAwesome Icons (Free 6.4.0) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #08080a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor principal estilo pantalla móvil */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 440px;
            max-height: 900px;
            background: radial-gradient(circle at 50% 20%, #1a080a 0%, #0c0507 50%, #050304 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 22px 24px 22px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* Encabezado RAYKO PLAY */
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }

        .main-title {
            font-family: 'Oswald', 'Montserrat', sans-serif;
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .title-rayko {
            color: #e6e6e6;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .title-play {
            color: #ff0015;
            text-shadow: 0 0 15px rgba(255, 0, 21, 0.8), 0 0 30px rgba(255, 0, 21, 0.5);
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 5px;
            color: #a0a0a8;
            margin-top: 12px;
            text-transform: uppercase;
        }

        /* Lista de Menús / Botones */
        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .btn-card {
            width: 100%;
            height: 82px;
            background: linear-gradient(180deg, #1c1c20 0%, #121215 100%);
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: none;
        }

        .btn-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .btn-card:hover::after, .btn-card:active::after {
            left: 140%;
        }

        .btn-card:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.1);
        }

        .btn-card:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        .btn-card.border-red {
            border-top: 2px solid #ff0022;
            border-bottom: 2px solid #ff0022;
            box-shadow: 0 0 15px rgba(255, 0, 34, 0.35), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-red::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #ff4d6d;
            box-shadow: 0 0 10px #ff0022;
        }

        .btn-card.border-silver {
            border-top: 2px solid #e0e0e6;
            border-bottom: 2px solid #b0b0b8;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-silver::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 32px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .btn-card:hover .btn-icon {
            transform: scale(1.12);
        }

        .btn-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Modal Contenido */
        .content-modal {
            position: absolute;
            inset: 0;
            background: #07070b;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            transform: translateY(30px);
        }

        .content-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 0, 34, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #ff0022;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background: #12121a;
            border: 1px solid #282838;
            border-radius: 12px;
            padding: 12px 16px 12px 42px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #ff0022;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }

        .loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 16px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,0,34,0.2);
            border-top: 3px solid #ff0022;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #ff0022 #12121a;
        }

        .channel-item {
            background: #121218;
            border: 1px solid #20202a;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .channel-item.live-now {
            border-color: #ff0022;
            background: linear-gradient(90deg, rgba(255,0,34,0.15) 0%, #121218 70%);
        }

        .channel-item:hover, .channel-item:active {
            background: #1c1c28;
            border-color: #ff0022;
            transform: translateX(4px) scale(1.01);
            box-shadow: 0 4px 15px rgba(255,0,34,0.2);
        }

        .channel-logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #1e1e28;
            object-fit: contain;
            padding: 4px;
            flex-shrink: 0;
        }

        .channel-category-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: rgba(255, 157, 0, 0.08);
            border: 1px solid rgba(255, 157, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff9d00;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .channel-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .channel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .channel-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time-badge {
            background: rgba(255, 255, 255, 0.1);
            color: #ffaa00;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .live-badge {
            background: #ff0022;
            color: #ffffff;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 8px;
            flex-shrink: 0;
            animation: pulseLive 1.5s infinite;
        }

        @keyframes pulseLive {
            0% { opacity: 0.6; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(0.95); }
        }

        .channel-group {
            font-size: 12px;
            color: #99a0b0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Logotipo Superior RAYKO PLAY -->
        <header class="logo-container">
            <h1 class="main-title">
                <span class="title-rayko">RAYKO</span>
                <span class="title-play">PLAY</span>
            </h1>
            <p class="subtitle">ENTRETENIMIENTO FREEMIUM</p>
        </header>

        <!-- Lista de Secciones -->
        <main class="menu-list">

            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="loadM3uServer(1)">
                <div class="btn-icon" style="color: #60a5fa;"><i class="fa-solid fa-tv"></i></div>
                <div class="btn-text">SERVIDOR 1</div>
            </div>

            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="loadM3uServer(2)">
                <div class="btn-icon" style="color: #38bdf8;"><i class="fa-solid fa-tower-broadcast"></i></div>
                <div class="btn-text">SERVIDOR 2</div>
            </div>

            <!-- EVENTOS EN VIVO: Lee el JSON y extrae la hora ej: 18:00 Liga Pro -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="loadEventosJson()">
                <div class="btn-icon" style="color: #ff0022;"><i class="fa-solid fa-calendar-days"></i></div>
                <div class="btn-text">EVENTOS EN VIVO</div>
            </div>

            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="loadPeliculasM3u()">
                <div class="btn-icon" style="color: #d1d5db;"><i class="fa-solid fa-film"></i></div>
                <div class="btn-text">PELÍCULAS COLECCIÓN</div>
            </div>

            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="handleCategoryClick('SERIES')">
                <div class="btn-icon" style="color: #38bdf8;"><i class="fa-solid fa-masks-theater"></i></div>
                <div class="btn-text">SERIES</div>
            </div>

        </main>

        <!-- Modal Contenido -->
        <div class="content-modal" id="contentModal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">
                    <i class="fa-solid fa-calendar-days"></i> EVENTOS EN VIVO
                </div>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar partido o equipo..." oninput="filterChannels()">
            </div>

            <div id="loader" class="loader-box">
                <div class="spinner"></div>
                <span>Analizando cartelera y horarios...</span>
            </div>

            <div class="channel-list" id="channelList" style="display: none;"></div>
        </div>

    </div>

    <!-- Script con Extractor de Hora del JSON -->
    <script>
        const M3U_URL_SERVER1 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";
        const M3U_URL_SERVER2 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";
        const M3U_URL_PELICULAS = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Peliculas.m3u";
        const JSON_URL_EVENTOS = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/eventos%20raiko%20play.json";

        let serverCache = { 1: [], 2: [] };
        let peliculasCache = [];
        let eventosCache = [];
        let currentServer = 1;
        let activeChannels = [];

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playHoverSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        function playSelectSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(650, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // Extrae la hora en formato HH:MM (ej. 18:00) del título o texto del evento del JSON
        function extractEventTime(title, group) {
            const fullText = (title + ' ' + (group || ''));
            const match = fullText.match(/\b([0-1]?[0-9]|2[0-3]):([0-5][0-9])\b/);
            if (match) {
                return `${match[1]}:${match[2]}`;
            }
            return null;
        }

        // Comprueba si la hora extraída coincide con la hora actual o la prioriza
        function processEventsWithTime(eventsList) {
            const now = new Date();
            const currentTotalMins = now.getHours() * 60 + now.getMinutes();

            return eventsList.map(event => {
                const timeStr = extractEventTime(event.title, event.group);
                let isLive = false;

                if (timeStr) {
                    const [h, m] = timeStr.split(':').map(Number);
                    const eventTotalMins = h * 60 + m;
                    // Considera en vivo si el partido comenzó hace menos de 2 horas o está en la hora actual
                    if (currentTotalMins >= eventTotalMins && currentTotalMins <= (eventTotalMins + 120)) {
                        isLive = true;
                    }
                } else {
                    // Si no tiene hora específica en el texto, se muestra disponible de inmediato
                    isLive = true;
                }

                return { ...event, timeStr, isLive };
            }).sort((a, b) => (b.isLive ? 1 : 0) - (a.isLive ? 1 : 0));
        }

        async function loadEventosJson() {
            playSelectSound();
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-calendar-days"></i> EVENTOS EN VIVO`;
            modal.classList.add('active');
            searchInput.value = '';

            if (eventosCache.length > 0) {
                activeChannels = processEventsWithTime(eventosCache);
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);
                return;
            }

            loader.style.display = 'flex';
            channelList.style.display = 'none';

            try {
                const response = await fetch(JSON_URL_EVENTOS);
                const data = await response.json();
                eventosCache = parseEventosJSON(data);
                
                activeChannels = processEventsWithTime(eventosCache);
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);
            } catch (e) {
                loadM3uServerWithFilter(1, 'event', 'EVENTOS EN VIVO');
            }
        }

        function parseEventosJSON(data) {
            let list = Array.isArray(data) ? data : (data.eventos || data.channels || data.items || data.data || []);
            return list.map(item => {
                const title = item.name || item.title || item.name_event || item.event_name || item.nombre || "Evento";
                const group = item.group || item.category || item.time || item.hora || "Partidos de Hoy";
                const logo = item.logo || item.image || item.img || item.icon || "";
                const url = item.url || item.stream || item.link || item.m3u8 || "";
                return { title, group, logo, url };
            }).filter(item => item.url.length > 0);
        }

        async function loadPeliculasM3u() {
            playSelectSound();
            loadM3uServerWithFilter(1, '', 'PELÍCULAS COLECCIÓN');
        }

        function handleCategoryClick(cat) {
            playSelectSound();
            loadM3uServerWithFilter(1, cat, cat);
        }

        function getCategoryIcon(groupName, titleName = '') {
            const text = (groupName + ' ' + titleName).toLowerCase();
            if (text.includes('vs') || text.includes('liga') || text.includes('pro')) return 'calendar-days';
            if (text.includes('deport') || text.includes('espn')) return 'trophy';
            return 'tv';
        }

        async function loadM3uServerWithFilter(serverNum, initialFilter = '', displayTitle = '') {
            currentServer = serverNum;
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');
            const targetUrl = serverNum === 1 ? M3U_URL_SERVER1 : M3U_URL_SERVER2;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-tv"></i> ${displayTitle || 'SERVIDOR ' + serverNum}`;
            modal.classList.add('active');
            searchInput.value = initialFilter;

            loader.style.display = 'flex';
            channelList.style.display = 'none';

            try {
                const response = await fetch(targetUrl);
                const text = await response.text();
                serverCache[serverNum] = parseM3U(text);
                activeChannels = serverCache[serverNum];
                
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                if (initialFilter) filterChannels();
                else renderChannels(activeChannels);
            } catch (e) {
                loader.innerHTML = `<span>Error al cargar</span>`;
            }
        }

        function loadM3uServer(serverNum) {
            playSelectSound();
            loadM3uServerWithFilter(serverNum, '');
        }

        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : "General";
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.title = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Canal";
                } else if (line.length > 0 && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        function renderChannels(channels) {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '';

            if (channels.length === 0) {
                channelList.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">No se encontraron eventos</div>`;
                return;
            }

            channels.forEach((ch) => {
                const item = document.createElement('div');
                item.className = ch.isLive ? 'channel-item live-now' : 'channel-item';
                item.onmouseenter = playHoverSound;
                item.onclick = () => {
                    playSelectSound();
                    playStream(ch);
                };

                const iconClass = getCategoryIcon(ch.group, ch.title);
                const logoHtml = ch.logo ? 
                    `<img class="channel-logo" src="${ch.logo}" alt="Logo" onerror="this.onerror=null; this.outerHTML='<div class=\\'channel-category-icon\\'><i class=\\'fa-solid fa-${iconClass}\\'></i></div>';">` :
                    `<div class="channel-category-icon"><i class="fa-solid fa-${iconClass}"></i></div>`;

                const badgeHtml = ch.isLive 
                    ? `<span class="live-badge">EN VIVO AHORA</span>` 
                    : (ch.timeStr ? `<span class="time-badge">${ch.timeStr}</span>` : '');

                item.innerHTML = `
                    ${logoHtml}
                    <div class="channel-details">
                        <div class="channel-title-row">
                            <div class="channel-title">${ch.title}</div>
                            ${badgeHtml}
                        </div>
                        <div class="channel-group"><i class="fa-solid fa-folder" style="font-size:10px; margin-right:4px;"></i>${ch.group}</div>
                    </div>
                `;
                channelList.appendChild(item);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = activeChannels.filter(ch => 
                ch.title.toLowerCase().includes(query) || 
                ch.group.toLowerCase().includes(query) ||
                (ch.timeStr && ch.timeStr.includes(query))
            );
            renderChannels(filtered);
        }

        function playStream(channel) {
            // 🔥 CAMBIO CLAVE: Enviar al Android nativo para reproducir con ExoPlayer
            if (window.Android && window.Android.playChannelFromWeb) {
                window.Android.playChannelFromWeb(channel.title);
            } else {
                // Fallback: reproducir con HLS.js en el WebView
                const video = document.createElement('video');
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                document.body.appendChild(video);
                
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(channel.url);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = channel.url;
                }
            }
        }

        function closePlayer() {
            playSelectSound();
        }

        function closeModal() {
            playSelectSound();
            document.getElementById('contentModal').classList.remove('active');
        }
    </script>
</body>
</html>
