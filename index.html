<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GolStream Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src='//libtl.com/sdk.js' data-zone='11536430' data-sdk='show_11536430'></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #141414;
    --surface: #1F1F1F;
    --surface-hover: #2A2A2A;
    --red: #E50914;
    --text: #FFFFFF;
    --hint: #A3A3A3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
  }
  body{ padding:0 16px 96px; }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0 18px;
  }
  .logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.3px;
  }
  .logo span{ color:var(--red); }
  .live-tag{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--red);
    text-transform:uppercase;
  }
  .live-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--red);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ opacity:1; }
    50%{ opacity:0.35; }
    100%{ opacity:1; }
  }

  /* ---------- Section label ---------- */
  .section-title{
    font-size:17px;
    font-weight:700;
    margin:10px 0 12px 2px;
  }

  /* ---------- Signal rows ---------- */
  .signal{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--surface);
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .signal:active{
    background:var(--surface-hover);
    transform:scale(0.98);
  }
  .thumb{
    flex-shrink:0;
    width:64px;
    height:64px;
    border-radius:6px;
    background:linear-gradient(160deg, #333 0%, #1a1a1a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    position:relative;
    overflow:hidden;
  }
  .thumb .badge{
    position:absolute;
    bottom:4px;
    left:4px;
    right:4px;
    background:var(--red);
    color:#fff;
    font-size:9px;
    font-weight:800;
    letter-spacing:0.5px;
    text-align:center;
    border-radius:3px;
    padding:2px 0;
  }
  .signal-info{ flex:1; min-width:0; }
  .signal-info .title{
    font-size:15px;
    font-weight:700;
  }
  .signal-info .sub{
    color:var(--hint);
    font-size:12.5px;
    margin-top:3px;
  }
  .play-icon{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    font-size:14px;
  }

  /* ---------- CTA ---------- */
  .cta-primary{
    display:block;
    width:100%;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:15px;
    font-weight:700;
    margin-top:14px;
  }
  .cta-ghost{
    display:block;
    width:100%;
    background:rgba(255,255,255,0.08);
    color:var(--text);
    border:none;
    border-radius:8px;
    padding:13px;
    font-size:14px;
    font-weight:600;
    margin-top:10px;
  }

  /* ---------- Status ---------- */
  .status{
    text-align:center;
    color:var(--hint);
    font-size:11px;
    margin-top:22px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Gol<span>Stream</span></div>
  <div class="live-tag">
    <span class="live-dot"></span>
    En vivo
  </div>
</header>

<div class="section-title">Señales disponibles</div>

<div class="signal" onclick="openLink('https://redvelvetclub.blogspot.com/p/adbloc-repro.html?r=aHR0cHM6Ly9mdXRib2xsaWJyZS5jaC9oZC5waHA/c3RyZWFtPWZveGRlcG9ydGVz')">
  <div class="thumb">📺<div class="badge">VIVO</div></div>
  <div class="signal-info">
    <div class="title"> Al Hilal vs Al Faisaly</div>
    <div class="sub">13:00 🇸🇦 Pro League</div>
  </div>
  <div class="play-icon">▶</div>
</div>

<div class="signal" onclick="openLink('https://redvelvetclub.blogspot.com/p/adbloc-repro.html?r=aHR0cHM6Ly9mdXRib2xsaWJyZS5jaC9oZC5waHA/c3RyZWFtPWVzcG41')">
  <div class="thumb">📺<div class="badge">VIVO</div></div>
  <div class="signal-info">
    <div class="title">Wolverhampton Wanderers vs Blackburn Rovers</div>
    <div class="sub">14:00 🏆 Championship</div>
  </div>
  <div class="play-icon">▶</div>
</div>

<div class="signal" onclick="openLink('https://redvelvetclub.blogspot.com/p/blog-page_06.html')">
  <div class="thumb">📺<div class="badge">VIVO</div></div>
  <div class="signal-info">
    <div class="title">Señal 3</div>
    <div class="sub">Fútbol en directo ahora</div>
  </div>
  <div class="play-icon">▶</div>
</div>

<button class="cta-ghost" onclick="shareApp()">Compartir con amigos</button>

<div class="status" id="status">Cargando...</div>

<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    // Ajusta el color de la barra superior al tema de Telegram
    tg.setHeaderColor('secondary_bg_color');

    // Botón principal nativo de Telegram (abajo)
    tg.MainButton.setText('Ver en vivo ahora');
    tg.MainButton.show();
    tg.MainButton.onClick(() => openLink('https://redvelvetclub.blogspot.com/p/blog-page_06.html'));

    // Botón de retroceso nativo
    tg.BackButton.hide();

    document.getElementById('status').textContent =
      `Hola ${tg.initDataUnsafe?.user?.first_name || ''} · v${tg.version}`;

    // Interstitial de bienvenida — se dispara una sola vez por sesión,
    // apenas carga la app, sin que el usuario tenga que tocar nada.
    if (!sessionStorage.getItem('welcomeAdShown') && typeof show_11536430 === 'function') {
      sessionStorage.setItem('welcomeAdShown', '1');
      // Pequeño delay para que la UI ya esté pintada antes del ad
      setTimeout(() => {
        show_11536430({ type: 'inApp' }).catch(() => {});
      }, 600);
    }

  } else {
    document.getElementById('status').textContent =
      'Abrí esta app desde Telegram para la mejor experiencia';
  }

  function goToUrl(url){
    if (tg) {
      tg.openLink(url); // abre en navegador externo dentro del contexto de Telegram
    } else {
      location.href = url; // funciona bien dentro de un WebView nativo (Android)
    }
  }

  function openLink(url){
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

    // Rewarded interstitial: el usuario ve el anuncio y, como recompensa,
    // se desbloquea el acceso a la señal/canal.
    // Se agrega un timeout de seguridad: si el anuncio no responde
    // (sin inventario disponible, se queda colgado, etc.) navegamos igual.
    if (typeof show_11536430 === 'function') {
      let navigated = false;
      const goOnce = () => {
        if (navigated) return;
        navigated = true;
        goToUrl(url);
      };

      show_11536430().then(goOnce).catch(goOnce);

      // Salvavidas: si en 8 segundos no pasó nada, navega de todas formas
      setTimeout(goOnce, 8000);
    } else {
      goToUrl(url);
    }
  }

  function shareApp(){
    if (tg) {
      tg.HapticFeedback?.impactOccurred('medium');
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent('https://t.me/TurboTVPlus_bot/golstream')}&text=${encodeURIComponent('Mira fútbol en vivo gratis 🔴⚽')}`;
      tg.openTelegramLink(shareUrl);
    }
  }
</script>

</body>
</html>
