<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYKO PLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #091325 0%, #050b16 50%, #0d1b32 100%);
            color: #ffffff;
            user-select: none;
            overflow-x: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .neon-box {
            background: linear-gradient(145deg, rgba(16, 30, 54, 0.9), rgba(11, 21, 38, 0.95));
            border: 1px solid rgba(0, 212, 255, 0.35);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.12), inset 0 0 10px rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-box:hover {
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.45), inset 0 0 15px rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            transform: translateY(-2px) scale(1.01);
        }
        .neon-text {
            background: linear-gradient(to right, #00d4ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5));
        }
        .channel-card {
            background: linear-gradient(145deg, #ffffff, #e6f0fa);
            color: #000;
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,114,255,0.2);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .channel-card:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.5);
        }
        .scrollable-channels {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-width: thin;
            scrollbar-color: #00d4ff #0b1526;
            max-height: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1526;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #00d4ff, #0072ff);
            border-radius: 3px;
        }
        #app-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO (Visible solo en el Menú Principal) -->
    <header id="app-header" class="w-full flex-shrink-0 mb-2">
        <div class="w-full max-w-2xl mx-auto flex justify-between items-center px-1 mb-1">
            <span id="live-clock" class="text-xs font-bold text-cyan-300 tracking-wider">00:00</span>
            <span class="bg-gradient-to-r from-cyan-500/20 to-blue-600/20 border border-cyan-500/40 text-cyan-300 text-[9px] uppercase font-extrabold px-3 py-0.5 rounded-full tracking-widest shadow">
                ✨ HD Activa
            </span>
        </div>
        <div class="w-full max-w-2xl mx-auto text-center">
            <h1 class="text-3xl sm:text-4xl font-black tracking-wider text-white">
                RAYKO <span class="neon-text">PLAY</span>
            </h1>
            <p class="text-[10px] uppercase tracking-[0.25em] text-cyan-200/70 mt-1 font-bold">
                ENTRETENIMIENTO FREEMIUM 2026
            </p>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="w-full max-w-2xl mx-auto flex flex-col h-full overflow-hidden">
        <!-- Dynamic Views Rendered Here -->
    </main>

    <!-- Video Modal -->
    <div id="video-modal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
        <div class="w-full max-w-md bg-slate-900 rounded-2xl overflow-hidden border border-cyan-500/50 shadow-[0_0_50px_rgba(0,212,255,0.35)] relative transform transition-all">
            <div class="bg-slate-950 p-4 flex justify-between items-center border-b border-cyan-950">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                    <h3 id="modal-title" class="font-bold text-cyan-300 tracking-wide text-sm uppercase">CONECTANDO SEÑAL...</h3>
                </div>
                <button onclick="closePlayer()" class="text-cyan-300 hover:text-white font-bold text-lg px-3 py-1 bg-slate-800/50 hover:bg-slate-800 rounded-lg transition">✕</button>
            </div>
            <div class="relative aspect-video bg-slate-950 flex items-center justify-center overflow-hidden">
                <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 z-20 transition-opacity">
                    <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(0,212,255,0.8)]"></div>
                    <span class="text-sm text-cyan-200 tracking-widest font-semibold animate-pulse">CARGANDO RECURSOS...</span>
                </div>
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-950/40 via-slate-950 to-slate-950 opacity-90"></div>
                <div class="text-center p-5 z-10">
                    <div class="text-6xl mb-3 animate-pulse">📡</div>
                    <p id="playing-text" class="text-lg font-bold text-white tracking-wide">Reproduciendo Contenido...</p>
                    <p class="text-sm text-cyan-300 mt-2 font-medium bg-cyan-950/60 py-1 px-4 rounded-full inline-block border border-cyan-500/30">Señal Optimizada</p>
                </div>
            </div>
            <div class="p-4 bg-slate-900 flex justify-between items-center border-t border-cyan-950">
                <span class="text-sm text-cyan-300/70 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Servidor Estable</span>
                <button onclick="closePlayer()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 text-white text-sm px-6 py-3 rounded-xl font-bold shadow-lg shadow-cyan-500/30 transition transform active:scale-95">Cerrar Reproductor</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let allChannels = [];

        const state = {
            currentView: 'home', 
            selectedCategory: '',
            selectedServer: 'TV FREEMIUM',
            searchQuery: ''
        };

        function receiveChannelsFromApp(jsonData) {
            try {
                allChannels = JSON.parse(jsonData);
                
                const categories = [
                    { id: 'Deportes', title: '⚽ DEPORTES', action: 'goToContent', type: 'Deportes', desc: 'Todo el deporte en vivo' },
                    { id: 'Cine y Series', title: '🎬 CINE Y SERIES', action: 'goToContent', type: 'Cine y Series', desc: 'Lo más reciente del cine' },
                    { id: 'Eventos', title: '🔥 EVENTOS', action: 'goToContent', type: 'Eventos', desc: 'Sagas y eventos destacados' },
                    { id: 'General', title: '📡 GENERAL', action: 'goToContent', type: 'General', desc: 'Contenido variado' }
                ];
                
                window.categories = categories;
                render();
            } catch (e) {
                console.error("Error al recibir los canales", e);
            }
        }

        function playFromApp(name) {
            if (window.Android) {
                window.Android.playChannelFromWeb(name);
            } else {
                openPlayer(name);
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            const channelsArray = allChannels && allChannels.length > 0 ? allChannels : [];

            if (state.currentView === 'home') {
                document.getElementById('app-header').classList.remove('header-hidden');
                
                let html = '<div class="content-area space-y-3 w-full">';
                const cats = window.categories || [];
                
                cats.forEach(cat => {
                    html += `
                        <div onclick="${cat.action}('${cat.type || cat.id}')" class="neon-box rounded-2xl p-5 flex items-center justify-between cursor-pointer group">
                            <div>
                                <h3 class="font-black tracking-wide text-lg sm:text-xl text-white group-hover:text-cyan-300 transition">${cat.title}</h3>
                                <p class="text-sm text-cyan-200/60 font-medium mt-1">${cat.desc}</p>
                            </div>
                            <span class="text-cyan-400/60 group-hover:text-cyan-300 group-hover:translate-x-1 transition font-black text-xl">›</span>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } 
            else {
                document.getElementById('app-header').classList.add('header-hidden');
            }

            if (state.currentView === 'channels') {
                let filteredChannels = channelsArray.filter(ch => 
                    ch.name.toLowerCase().includes(state.searchQuery.toLowerCase()) || 
                    ch.category.toLowerCase().includes(state.searchQuery.toLowerCase())
                );

                let html = `
                    <div class="flex-shrink-0 mb-3 flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-black tracking-wider text-white">📺 CANALES</h2>
                            <p class="text-sm text-cyan-300 font-semibold">${state.selectedServer}</p>
                        </div>
                        <button onclick="goHome()" class="text-sm bg-slate-900 hover:bg-slate-800 border border-cyan-900/50 px-4 py-2 rounded-xl text-cyan-200 font-bold transition shadow-md">← Menú</button>
                    </div>

                    <div class="flex-shrink-0 mb-4 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-cyan-400 text-lg">🔍</span>
                        <input type="text" id="channel-search" value="${state.searchQuery}" oninput="handleSearch(event)" placeholder="Buscar canal..." class="w-full bg-slate-900 border border-cyan-900/60 focus:border-cyan-400 rounded-2xl pl-12 pr-4 py-4 text-base text-white placeholder-cyan-500/50 focus:outline-none transition shadow-inner">
                        ${state.searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-cyan-300 hover:text-white text-lg font-bold">✕</button>` : ''}
                    </div>

                    <div class="scrollable-channels w-full">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-4">
                `;

                if (filteredChannels.length === 0) {
                    html += `
                        <div class="col-span-full text-center py-16 bg-slate-900/50 rounded-2xl border border-cyan-950">
                            <span class="text-4xl mb-3 block">📡</span>
                            <p class="text-base text-cyan-300/70 font-semibold">No se encontraron canales</p>
                        </div>
                    `;
                } else {
                    filteredChannels.forEach(ch => {
                        let logoHtml = '';
                        if (ch.logoUrl && ch.logoUrl.trim() !== '') {
                            logoHtml = `<img src="${ch.logoUrl}" alt="${ch.name}" class="max-h-14 max-w-full object-contain filter brightness-110" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\\'text-cyan-300 font-black text-lg\\'>${ch.name}</span>'">`;
                        } else {
                            logoHtml = `<span class="text-cyan-300 font-black text-lg">${ch.name}</span>`;
                        }

                        html += `
                            <div class="channel-card p-4 flex flex-col gap-3">
                                <div class="flex items-center justify-between">
                                    <span class="text-sm uppercase font-bold tracking-widest text-slate-700 bg-cyan-100 px-3 py-1 rounded-full">${ch.category || 'GENERAL'}</span>
                                </div>
                                <div class="h-20 w-full bg-slate-950 rounded-xl flex items-center justify-center p-3 border border-cyan-500/30 shadow-inner overflow-hidden">
                                    ${logoHtml}
                                </div>
                                <button onclick="playFromApp('${ch.name}')" class="w-full bg-gradient-to-r from-slate-900 to-blue-950 hover:from-cyan-500 hover:to-blue-600 text-white font-bold text-base py-3 rounded-xl tracking-wider transition shadow active:scale-95">▶ REPRODUCIR</button>
                            </div>
                        `;
                    });
                }
                html += `
                        </div>
                    </div>
                `;
                container.innerHTML = html;
                
                setTimeout(() => {
                    const input = document.getElementById('channel-search');
                    if (input && state.searchQuery) {
                        input.focus();
                        input.setSelectionRange(input.value.length, input.value.length);
                    }
                }, 10);
            }
            else if (state.currentView === 'movies') {
                let filteredChannels = channelsArray.filter(ch => 
                    ch.category === state.selectedCategory && 
                    ch.name.toLowerCase().includes(state.searchQuery.toLowerCase())
                );

                let html = `
                    <div class="flex-shrink-0 mb-3 flex items-center justify-between">
                        <div>
                            <h2 class="text-lg font-black tracking-wider text-white uppercase">${state.selectedCategory}</h2>
                            <p class="text-sm text-cyan-300 font-semibold">Selección Exclusiva</p>
                        </div>
                        <button onclick="goHome()" class="text-sm bg-slate-900 hover:bg-slate-800 border border-cyan-900/50 px-4 py-2 rounded-xl text-cyan-200 font-bold transition shadow-md">← Menú</button>
                    </div>

                    <div class="flex-shrink-0 mb-4 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-cyan-400 text-lg">🔍</span>
                        <input type="text" id="movie-search" value="${state.searchQuery}" oninput="handleSearch(event)" placeholder="Buscar..." class="w-full bg-slate-900 border border-cyan-900/60 focus:border-cyan-400 rounded-2xl pl-12 pr-4 py-4 text-base text-white placeholder-cyan-500/50 focus:outline-none transition shadow-inner">
                        ${state.searchQuery ? `<button onclick="clearSearch()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-cyan-300 hover:text-white text-lg font-bold">✕</button>` : ''}
                    </div>

                    <div class="scrollable-channels w-full space-y-3">
                `;

                if (filteredChannels.length === 0) {
                    html += `
                        <div class="text-center py-16 bg-slate-900/50 rounded-2xl border border-cyan-950">
                            <span class="text-4xl mb-3 block">🎬</span>
                            <p class="text-base text-cyan-300/70 font-semibold">No hay contenido en esta categoría</p>
                        </div>
                    `;
                } else {
                    filteredChannels.forEach(ch => {
                        let logoHtml = '';
                        if (ch.logoUrl && ch.logoUrl.trim() !== '') {
                            logoHtml = `<img src="${ch.logoUrl}" alt="${ch.name}" class="max-h-10 max-w-full object-contain filter brightness-110" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\\'text-cyan-300 font-black text-lg\\'>${ch.name}</span>'">`;
                        } else {
                            logoHtml = `<span class="text-cyan-300 font-black text-lg">${ch.name}</span>`;
                        }

                        html += `
                            <div class="neon-box rounded-2xl p-4 flex items-center justify-between cursor-pointer group" onclick="playFromApp('${ch.name}')">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-xl bg-cyan-500/15 flex items-center justify-center text-2xl border border-cyan-400/40 group-hover:scale-110 transition">
                                        ${logoHtml}
                                    </div>
                                    <span class="font-bold text-lg text-white group-hover:text-cyan-300 transition">${ch.name}</span>
                                </div>
                                <span class="text-sm bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow transition">Reproducir</span>
                            </div>
                        `;
                    });
                }
                html += '</div>';
                container.innerHTML = html;

                setTimeout(() => {
                    const input = document.getElementById('movie-search');
                    if (input && state.searchQuery) {
                        input.focus();
                        input.setSelectionRange(input.value.length, input.value.length);
                    }
                }, 10);
            }
        }

        function goHome() {
            state.searchQuery = '';
            state.currentView = 'home';
            render();
        }

        function goToContent(type) {
            state.selectedCategory = type;
            state.searchQuery = '';
            state.currentView = 'movies';
            render();
        }

        function handleSearch(e) {
            state.searchQuery = e.target.value;
            render();
        }

        function clearSearch() {
            state.searchQuery = '';
            render();
        }

        function openPlayer(title) {
            const modal = document.getElementById('video-modal');
            const modalTitle = document.getElementById('modal-title');
            const playingText = document.getElementById('playing-text');
            const spinner = document.getElementById('loading-spinner');

            modalTitle.innerText = `TRANSMISIÓN ACTIVA: ${title.toUpperCase()}`;
            playingText.innerText = `Reproduciendo: ${title}`;
            modal.classList.remove('hidden');

            spinner.style.opacity = '1';
            setTimeout(() => {
                spinner.style.opacity = '0';
                setTimeout(() => { spinner.style.display = 'none'; }, 300);
            }, 1000);
        }

        // 🟢 CORRECCIÓN: Al cerrar el player, NO recargamos la página, solo la lista
        function closePlayer() {
            const modal = document.getElementById('video-modal');
            modal.classList.add('hidden');
            document.getElementById('loading-spinner').style.display = 'flex';

            // Simplemente volvemos a renderizar la lista (esto mantiene la categoría)
            render(); 
        }

        // Reloj en tiempo real
        setInterval(() => {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('live-clock').innerText = `${hours}:${minutes}`;
        }, 1000);

        window.onload = () => {
            if (window.Android) {
                window.Android.sendChannelsToWeb();
            } else {
                receiveChannelsFromApp(JSON.stringify([
                    { name: "A&E OP1", category: "Cine y Series", logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/AMC_Logo_%282020%29.svg/320px-AMC_Logo_%282020%29.svg.png" },
                    { name: "A&E OP2 | AR", category: "Cine y Series", logoUrl: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/AXN_logo_2017.svg/320px-AXN_logo_2017.svg.png" }
                ]));
            }
        };
    </script>
</body>
</html>
