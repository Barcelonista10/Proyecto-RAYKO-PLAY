<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY IPTV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0F1621; color: #FFFFFF; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .background-video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 32%;
            z-index: 0;
            background: url('https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg') center/cover no-repeat;
        }
        .background-video-container::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, #0F1621 15%, transparent 100%);
        }

        .search-bar {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 30px; padding: 10px 15px; display: flex; align-items: center; gap: 10px;
        }
        .search-bar i { color: #FFF; font-size: 18px; }
        .search-bar input {
            background: transparent; border: none; color: #FFF; outline: none; width: 100px; font-size: 14px;
        }
        .search-bar input::placeholder { color: #AAA; }

        .tabs-top {
            position: relative; z-index: 10; margin-top: 34vh;
            display: flex; justify-content: center; gap: 30px; padding: 15px 0;
            border-bottom: 1px solid #253040;
        }
        .tab-btn {
            background: transparent; border: none; color: #8899AA; font-size: 16px; font-weight: 600; cursor: pointer;
            padding-bottom: 10px; position: relative;
        }
        .tab-btn.active { color: #3B82F6; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px;
            background: #3B82F6; border-radius: 10px;
        }

        .filter-scroll { z-index: 10; padding: 15px 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-chip {
            display: inline-block; background: #1E293B; color: #CBD5E1; padding: 8px 18px;
            border-radius: 20px; margin-right: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .filter-chip.active { background: #3B82F6; color: #FFF; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }

        .channel-list-container { flex: 1; overflow-y: auto; z-index: 10; padding-bottom: 80px; }
        .channel-list-container::-webkit-scrollbar { width: 4px; }
        .channel-list-container::-webkit-scrollbar-thumb { background: #3B82F6; border-radius: 10px; }

        .channel-item {
            display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #1A2332;
            cursor: pointer; transition: background 0.2s;
        }
        .channel-item:active { background: #1A2332; }
        .channel-logo { width: 40px; height: 40px; object-fit: contain; margin-right: 15px; background: #0F1621; border-radius: 5px; padding: 5px; }
        .channel-number { font-size: 16px; font-weight: bold; color: #8899AA; width: 40px; text-align: center; margin-right: 15px; }
        .channel-info { flex: 1; display: flex; flex-direction: column; }
        .channel-name { font-size: 15px; font-weight: 600; color: #FFF; }
        .channel-epg { font-size: 12px; color: #8899AA; margin-top: 3px; }
        .channel-arrow { color: #8899AA; font-size: 18px; background: rgba(255,255,255,0.05); width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 1px solid #2D3A4D; }

        .bottom-nav {
            position: absolute; bottom: 0; width: 100%; background: #0F1621; border-top: 1px solid #1A2332;
            display: flex; justify-content: space-around; padding: 10px 0 20px 0; z-index: 20;
        }
        .nav-item { text-align: center; color: #8899AA; font-size: 12px; cursor: pointer; transition: color 0.2s; }
        .nav-item i { display: block; font-size: 24px; margin-bottom: 5px; }
        .nav-item.active { color: #3B82F6; }
        
        .loading-text {
            padding: 30px; text-align: center; color: #8899AA; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="background-video-container"></div>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Buscar..." id="searchInput" onkeyup="filtrarCanales()">
    </div>

    <div class="tabs-top">
        <button class="tab-btn active" onclick="cambiarTab(this, 'categoria')">Categoría</button>
        <button class="tab-btn" onclick="cambiarTab(this, 'favoritos')">Favoritos</button>
    </div>

    <div class="filter-scroll" id="filtrosContainer"></div>
    <div class="channel-list-container" id="channelList">
        <div class="loading-text">Cargando canales desde la app...</div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="cambiarNav(this)">
            <i class="fas fa-home"></i><span>Inicio</span>
        </div>
        <div class="nav-item active" onclick="cambiarNav(this)">
            <i class="fas fa-tv"></i><span>Canales</span>
        </div>
        <div class="nav-item" onclick="cambiarNav(this)">
            <i class="fas fa-user"></i><span>Perfil</span>
        </div>
    </div>

    <script>
        let allChannels = [];

        // 1. LE PIDE LA LISTA DE CANALES A LA APP AL CARGAR
        function requestChannelsFromApp() {
            if (window.Android) {
                window.Android.sendChannelsToWeb();
            } else {
                // Si se abre en el navegador normal, carga un mensaje
                setTimeout(() => { 
                    document.getElementById('channelList').innerHTML = '<div class="loading-text">Abre esta web desde la App RAYKO PLAY</div>';
                }, 1000);
            }
        }

        // 2. RECIBE LA LISTA EN FORMATO JSON DESDE LA APP
        function receiveChannelsFromApp(jsonData) {
            try {
                allChannels = JSON.parse(jsonData);
                // Añadir un ID ficticio basado en el índice si no viene del JSON
                allChannels.forEach((c, index) => {
                    if(!c.id) c.id = String(index + 1).padStart(3, '0');
                });
                renderFilters();
                renderChannels();
            } catch (e) {
                console.error("Error al recibir los canales", e);
                document.getElementById('channelList').innerHTML = '<div class="loading-text">Error al cargar los datos</div>';
            }
        }

        function getCategories() {
            let cats = ["Todos"];
            allChannels.forEach(c => { if (!cats.includes(c.category)) cats.push(c.category); });
            return cats;
        }

        let currentCategory = "Todos";

        function renderFilters() {
            const container = document.getElementById('filtrosContainer');
            container.innerHTML = '';
            const categories = getCategories();
            categories.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'filter-chip' + (cat === currentCategory ? ' active' : '');
                btn.innerText = cat;
                btn.onclick = () => { currentCategory = cat; renderFilters(); renderChannels(); };
                container.appendChild(btn);
            });
        }

        function renderChannels() {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            
            if (allChannels.length === 0) {
                container.innerHTML = '<div class="loading-text">No se encontraron canales en la app</div>';
                return;
            }

            let filtered = allChannels;
            if (currentCategory !== "Todos") filtered = allChannels.filter(c => c.category === currentCategory);

            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query) filtered = filtered.filter(c => c.name.toLowerCase().includes(query));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="loading-text">No hay canales disponibles</div>`;
                return;
            }

            filtered.forEach(c => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                // 3. AL HACER CLIC, SE LLAMA AL PUENTE DE JAVA CON EL NOMBRE EXACTO
                item.onclick = () => {
                    if (window.Android) {
                        window.Android.playChannelFromWeb(c.name);
                    }
                };

                item.innerHTML = `
                    <img class="channel-logo" src="${c.logoUrl || ''}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/RAYKO_LOGO.svg/1200px-RAYKO_LOGO.svg.png'">
                    <div class="channel-number">${c.id || ''}</div>
                    <div class="channel-info"><div class="channel-name">${c.name}</div><div class="channel-epg">${c.epg || 'En vivo'}</div></div>
                    <div class="channel-arrow"><i class="fas fa-arrow-right"></i></div>
                `;
                container.appendChild(item);
            });
        }

        function cambiarTab(btn, tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function cambiarNav(item) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        }

        function filtrarCanales() { renderChannels(); }

        // Inicializar
        window.onload = function() {
            requestChannelsFromApp();
        };
    </script>
</body>
</html>
