
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY - Detección Automática de Películas por Año</title>
    <!-- FontAwesome Icons (Free 6.4.0) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <!-- HLS.js para reproducción de video streaming en directo -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #08080a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor principal estilo pantalla móvil */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 440px;
            max-height: 900px;
            background: radial-gradient(circle at 50% 20%, #1a080a 0%, #0c0507 50%, #050304 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 22px 24px 22px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* Encabezado RAYKO PLAY */
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }

        .main-title {
            font-family: 'Oswald', 'Montserrat', sans-serif;
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .title-rayko {
            color: #e6e6e6;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .title-play {
            color: #ff0015;
            text-shadow: 0 0 15px rgba(255, 0, 21, 0.8), 0 0 30px rgba(255, 0, 21, 0.5);
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 5px;
            color: #a0a0a8;
            margin-top: 12px;
            text-transform: uppercase;
        }

        /* Lista de Menús / Botones */
        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Estilo base de las tarjetas con efectos mejorados */
        .btn-card {
            width: 100%;
            height: 82px;
            background: linear-gradient(180deg, #1c1c20 0%, #121215 100%);
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        box-shadow 0.2s ease, 
                        border-color 0.2s ease, 
                        filter 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: none;
        }

        /* Destello luminoso que recorre la tarjeta al hacer hover/click */
        .btn-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .btn-card:hover::after, .btn-card:active::after {
            left: 140%;
        }

        .btn-card:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.1);
        }

        .btn-card:active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* Bordes Neón Rojo (Servidor 1, Eventos en Vivo, Series) */
        .btn-card.border-red {
            border-top: 2px solid #ff0022;
            border-bottom: 2px solid #ff0022;
            box-shadow: 0 0 15px rgba(255, 0, 34, 0.35), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-red::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #ff4d6d;
            box-shadow: 0 0 10px #ff0022;
        }

        .btn-card.border-red:hover {
            box-shadow: 0 0 25px rgba(255, 0, 34, 0.65), 0 12px 25px rgba(0, 0, 0, 0.8);
        }

        .btn-card.border-red:active {
            box-shadow: 0 0 35px rgba(255, 0, 34, 0.9), 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* Bordes Blanco / Plateado (Servidor 2, Películas Colección) */
        .btn-card.border-silver {
            border-top: 2px solid #e0e0e6;
            border-bottom: 2px solid #b0b0b8;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-silver::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .btn-card.border-silver:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4), 0 12px 25px rgba(0, 0, 0, 0.8);
        }

        .btn-card.border-silver:active {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7), 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* Iconos de los botones */
        .btn-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 32px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .btn-card:hover .btn-icon {
            transform: scale(1.12);
        }

        /* Texto dentro de los botones */
        .btn-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Modal para Contenidos */
        .content-modal {
            position: absolute;
            inset: 0;
            background: #07070b;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            transform: translateY(30px);
        }

        .content-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 0, 34, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #ff0022;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Buscador */
        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background: #12121a;
            border: 1px solid #282838;
            border-radius: 12px;
            padding: 12px 16px 12px 42px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #ff0022;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }

        /* Barra de Filtro por Años (Chips horizontales) */
        .year-filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }

        .year-filter-bar::-webkit-scrollbar {
            display: none;
        }

        .year-chip {
            background: #181824;
            border: 1px solid #2a2a3c;
            color: #aaaaaa;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .year-chip.active {
            background: #ff0022;
            border-color: #ff3355;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 0, 34, 0.5);
        }

        /* Indicador de Carga */
        .loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 16px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,0,34,0.2);
            border-top: 3px solid #ff0022;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Lista de Canales / Películas */
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #ff0022 #12121a;
        }

        .channel-item {
            background: #121218;
            border: 1px solid #20202a;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .channel-item:hover, .channel-item:active {
            background: #1c1c28;
            border-color: #ff0022;
            transform: translateX(4px) scale(1.01);
            box-shadow: 0 4px 15px rgba(255,0,34,0.2);
        }

        .channel-logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #1e1e28;
            object-fit: contain;
            padding: 4px;
            flex-shrink: 0;
        }

        /* Contenedor de Icono Dorado/Naranja por Categoría */
        .channel-category-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: rgba(255, 157, 0, 0.08);
            border: 1px solid rgba(255, 157, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff9d00;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .channel-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .channel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .channel-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Insignia de Año */
        .year-badge {
            background: rgba(255, 0, 34, 0.18);
            border: 1px solid rgba(255, 0, 34, 0.4);
            color: #ff3355;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .channel-group {
            font-size: 12px;
            color: #99a0b0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-year-tag {
            color: #ff0022;
            font-weight: 700;
        }

        /* Reproductor Modal */
        .player-view {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .player-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-container {
            width: 100%;
            height: 250px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-close-player {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .player-info {
            padding: 20px;
            flex: 1;
            background: #0b0b10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playing-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .playing-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 0, 34, 0.2);
            color: #ff0022;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            width: fit-content;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Logotipo Superior RAYKO PLAY -->
        <header class="logo-container">
            <h1 class="main-title">
                <span class="title-rayko">RAYKO</span>
                <span class="title-play">PLAY</span>
            </h1>
            <p class="subtitle">ENTRETENIMIENTO FREEMIUM</p>
        </header>

        <!-- Lista de Secciones principales -->
        <main class="menu-list">

            <!-- 1. SERVIDOR 1 (Televisor) -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="loadM3uServer(1)">
                <div class="btn-icon" style="color: #60a5fa;">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <div class="btn-text">SERVIDOR 1</div>
            </div>

            <!-- 2. SERVIDOR 2 (Antena / Señal) -->
            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="loadM3uServer(2)">
                <div class="btn-icon" style="color: #38bdf8;">
                    <i class="fa-solid fa-tower-broadcast"></i>
                </div>
                <div class="btn-text">SERVIDOR 2</div>
            </div>

            <!-- 3. EVENTOS EN VIVO (Carga JSON de Eventos) -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="loadEventosJson()">
                <div class="btn-icon" style="color: #ff0022;">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div class="btn-text">EVENTOS EN VIVO</div>
            </div>

            <!-- 4. PELÍCULAS COLECCIÓN (Detección Automática por Año) -->
            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="loadPeliculasM3u()">
                <div class="btn-icon" style="color: #d1d5db;">
                    <i class="fa-solid fa-film"></i>
                </div>
                <div class="btn-text">PELÍCULAS COLECCIÓN</div>
            </div>

            <!-- 5. SERIES (Máscaras de Teatro) -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="handleCategoryClick('SERIES')">
                <div class="btn-icon" style="color: #38bdf8;">
                    <i class="fa-solid fa-masks-theater"></i>
                </div>
                <div class="btn-text">SERIES</div>
            </div>

        </main>

        <!-- Modal de Canales / Películas -->
        <div class="content-modal" id="contentModal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">
                    <i class="fa-solid fa-tv"></i> SERVIDOR 1
                </div>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Buscador -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar por título, año o género..." oninput="filterChannels()">
            </div>

            <!-- Barra de Filtro Automático por Años de Estreno -->
            <div class="year-filter-bar" id="yearFilterBar" style="display: none;">
                <div class="year-chip active" onclick="setYearFilter('todos', this)">TODOS</div>
                <!-- Chips de Años generados dinámicamente -->
            </div>

            <!-- Loader / Lista de canales -->
            <div id="loader" class="loader-box">
                <div class="spinner"></div>
                <span>Cargando contenidos...</span>
            </div>

            <div class="channel-list" id="channelList" style="display: none;"></div>
        </div>

        <!-- Vista Reproductor HLS -->
        <div class="player-view" id="playerView">
            <div class="video-container">
                <button class="btn-close-player" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
                <video id="videoPlayer" controls autoplay playsinline></video>
            </div>
            <div class="player-info">
                <div class="playing-badge">
                    <i class="fa-solid fa-play"></i> REPRODUCIENDO CONTENIDO
                </div>
                <div class="playing-title" id="playingTitle">Título</div>
                <p id="playingGroup" style="font-size: 13px; color: #888;">RAYKO PLAY Películas</p>
            </div>
        </div>

    </div>

    <!-- Script de Integración M3U, Detección por Año & Player -->
    <script>
        // Enlaces de listas M3U y JSON
        const M3U_URL_SERVER1 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";
        const M3U_URL_SERVER2 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";
        const M3U_URL_PELICULAS = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Peliculas.m3u";
        const JSON_URL_EVENTOS = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/eventos%20raiko%20play.json";

        let serverCache = { 1: [], 2: [] };
        let peliculasCache = [];
        let eventosCache = [];
        let currentServer = 1;
        let activeChannels = [];
        let selectedYearFilter = 'todos';
        let hlsInstance = null;

        // Contexto de Audio Web Sintetizado
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playHoverSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        function playSelectSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(650, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // Función para extraer el Año de Estreno del Título o Grupo mediante Expresiones Regulares
        function extractReleaseYear(title, group = '') {
            const fullText = title + ' ' + group;
            // Busca patrones de años como (2026), [2025], 2024, etc. entre 1900 y 2099
            const match = fullText.match(/\b(19\d\d|20\d\d)\b/);
            return match ? match[1] : null;
        }

        // Cargar Lista M3U exclusiva de Películas Colección con Detección por Año
        async function loadPeliculasM3u() {
            playSelectSound();
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');
            const yearFilterBar = document.getElementById('yearFilterBar');

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-film"></i> PELÍCULAS COLECCIÓN`;
            modal.classList.add('active');
            searchInput.value = '';
            selectedYearFilter = 'todos';

            if (peliculasCache.length > 0) {
                activeChannels = peliculasCache;
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                buildYearChips(activeChannels);
                renderChannels(activeChannels);
                return;
            }

            loader.style.display = 'flex';
            channelList.style.display = 'none';
            yearFilterBar.style.display = 'none';

            try {
                const response = await fetch(M3U_URL_PELICULAS);
                if (!response.ok) throw new Error("Error al descargar lista M3U de películas");
                const text = await response.text();

                peliculasCache = parseM3U(text);
                activeChannels = peliculasCache;

                loader.style.display = 'none';
                channelList.style.display = 'flex';
                buildYearChips(activeChannels);
                renderChannels(activeChannels);

            } catch (error) {
                console.error("Error leyendo M3U de películas:", error);
                loader.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="font-size:32px; color:#ff0022;"></i><span>Error al cargar Películas</span>`;
            }
        }

        // Genera botones/chips de filtro automático por años detectados
        function buildYearChips(items) {
            const yearFilterBar = document.getElementById('yearFilterBar');
            yearFilterBar.innerHTML = '<div class="year-chip active" onclick="setYearFilter(\'todos\', this)">TODOS</div>';

            const yearsMap = {};
            items.forEach(item => {
                if (item.year) {
                    yearsMap[item.year] = (yearsMap[item.year] || 0) + 1;
                }
            });

            const sortedYears = Object.keys(yearsMap).sort((a, b) => b - a);

            if (sortedYears.length > 0) {
                sortedYears.forEach(yr => {
                    const chip = document.createElement('div');
                    chip.className = 'year-chip';
                    chip.innerText = `${yr} (${yearsMap[yr]})`;
                    chip.onclick = () => setYearFilter(yr, chip);
                    yearFilterBar.appendChild(chip);
                });
                yearFilterBar.style.display = 'flex';
            } else {
                yearFilterBar.style.display = 'none';
            }
        }

        // Establecer filtro por año seleccionado
        function setYearFilter(year, element) {
            playSelectSound();
            selectedYearFilter = year;
            
            document.querySelectorAll('.year-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');

            filterChannels();
        }

        // Cargar Eventos desde el archivo JSON
        async function loadEventosJson() {
            playSelectSound();
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');
            const yearFilterBar = document.getElementById('yearFilterBar');

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-calendar-days"></i> EVENTOS EN VIVO`;
            modal.classList.add('active');
            searchInput.value = '';
            yearFilterBar.style.display = 'none';

            if (eventosCache.length > 0) {
                activeChannels = eventosCache;
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);
                return;
            }

            loader.style.display = 'flex';
            channelList.style.display = 'none';

            try {
                const response = await fetch(JSON_URL_EVENTOS);
                if (!response.ok) throw new Error("Error al descargar el JSON de eventos");
                const data = await response.json();

                eventosCache = parseEventosJSON(data);

                if (eventosCache.length === 0) {
                    loadM3uServerWithFilter(1, 'event', 'EVENTOS EN VIVO');
                    return;
                }

                activeChannels = eventosCache;
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);

            } catch (error) {
                console.error("Error leyendo JSON de eventos:", error);
                loadM3uServerWithFilter(1, 'event', 'EVENTOS EN VIVO');
            }
        }

        // Parseador flexible de esquemas JSON
        function parseEventosJSON(data) {
            let list = [];
            if (Array.isArray(data)) {
                list = data;
            } else if (data && typeof data === 'object') {
                list = data.eventos || data.channels || data.items || data.data || [];
            }

            return list.map(item => {
                const title = item.name || item.title || item.name_event || item.event_name || item.nombre || "Evento en Vivo";
                const group = item.group || item.category || item.time || item.hora || "Eventos Especiales";
                const logo = item.logo || item.image || item.img || item.icon || "";
                const url = item.url || item.stream || item.link || item.m3u8 || "";
                const year = extractReleaseYear(title, group);

                return { title, group, logo, url, year };
            }).filter(item => item.url.length > 0 || item.title.length > 0);
        }

        // Manejador de clics para Series
        function handleCategoryClick(categoryName) {
            playSelectSound();
            document.getElementById('yearFilterBar').style.display = 'none';
            loadM3uServerWithFilter(1, categoryName, categoryName);
        }

        // Obtener icono FontAwesome
        function getCategoryIcon(groupName, titleName = '') {
            const text = (groupName + ' ' + titleName).toLowerCase();
            
            if (text.includes('event') || text.includes('ppv') || text.includes('vivo') || text.includes('especial')) {
                return 'calendar-days';
            }
            if (text.includes('deport') || text.includes('sport') || text.includes('espn') || text.includes('fox') || text.includes('liga') || text.includes('win') || text.includes('gol')) {
                return 'trophy';
            }
            if (text.includes('noticia') || text.includes('news') || text.includes('info') || text.includes('24') || text.includes('cnn')) {
                return 'newspaper';
            }
            if (text.includes('music') || text.includes('música') || text.includes('hit') || text.includes('mtv') || text.includes('radio')) {
                return 'music';
            }
            if (text.includes('docu') || text.includes('cultur') || text.includes('geo') || text.includes('discovery') || text.includes('history') || text.includes('planet')) {
                return 'globe';
            }
            if (text.includes('serie') || text.includes('novel') || text.includes('dram')) {
                return 'masks-theater';
            }
            if (text.includes('cine') || text.includes('pelicula') || text.includes('movie') || text.includes('hbo') || text.includes('star') || text.includes('estreno') || text.includes('plus')) {
                return 'clapperboard';
            }
            if (text.includes('infantil') || text.includes('kid') || text.includes('anim') || text.includes('disney') || text.includes('cartoon') || text.includes('nick')) {
                return 'child';
            }
            if (text.includes('adult') || text.includes('18') || text.includes('xxx')) {
                return 'lock';
            }
            
            return 'film';
        }

        // Cargar Lista M3U para Servidores con filtro opcional
        async function loadM3uServerWithFilter(serverNum, initialFilter = '', displayTitle = '') {
            currentServer = serverNum;
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');
            const yearFilterBar = document.getElementById('yearFilterBar');
            const targetUrl = serverNum === 1 ? M3U_URL_SERVER1 : M3U_URL_SERVER2;

            const titleText = displayTitle || (initialFilter ? initialFilter.toUpperCase() : `SERVIDOR ${serverNum}`);
            const iconClass = getCategoryIcon(initialFilter || titleText);

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-${iconClass}"></i> ${titleText}`;
            modal.classList.add('active');
            searchInput.value = initialFilter;
            yearFilterBar.style.display = 'none';

            if (serverCache[serverNum].length > 0) {
                activeChannels = serverCache[serverNum];
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                if (initialFilter) {
                    filterChannels();
                } else {
                    renderChannels(activeChannels);
                }
                return;
            }

            loader.style.display = 'flex';
            channelList.style.display = 'none';

            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Error al descargar lista M3U");
                const text = await response.text();
                
                serverCache[serverNum] = parseM3U(text);
                activeChannels = serverCache[serverNum];
                
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                
                if (initialFilter) {
                    filterChannels();
                } else {
                    renderChannels(activeChannels);
                }
            } catch (error) {
                console.error(error);
                loader.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="font-size:32px; color:#ff0022;"></i><span>Error al cargar contenidos</span>`;
            }
        }

        function loadM3uServer(serverNum) {
            playSelectSound();
            document.getElementById('yearFilterBar').style.display = 'none';
            loadM3uServerWithFilter(serverNum, '');
        }

        // Parseador M3U con detección integrada de año
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};

                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch && logoMatch[1]) {
                        currentChannel.logo = logoMatch[1];
                    }

                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch && groupMatch[1]) {
                        currentChannel.group = groupMatch[1];
                    } else {
                        currentChannel.group = "Películas";
                    }

                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentChannel.title = line.substring(commaIndex + 1).trim();
                    } else {
                        currentChannel.title = "Título no disponible";
                    }

                    // Extrae automáticamente el año de lanzamiento
                    currentChannel.year = extractReleaseYear(currentChannel.title, currentChannel.group);

                } else if (line.length > 0 && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        // Renderizar elementos en pantalla con año en el subtítulo y en el badge
        function renderChannels(channels) {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '';

            if (channels.length === 0) {
                channelList.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">No se encontraron elementos en esta categoría/año</div>`;
                return;
            }

            channels.forEach((ch) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.onmouseenter = playHoverSound;
                item.onclick = () => {
                    playSelectSound();
                    playStream(ch);
                };

                const iconClass = getCategoryIcon(ch.group, ch.title);

                const logoHtml = ch.logo ? 
                    `<img class="channel-logo" src="${ch.logo}" alt="Poster" onerror="this.onerror=null; this.outerHTML='<div class=\\'channel-category-icon\\'><i class=\\'fa-solid fa-${iconClass}\\'></i></div>';">` :
                    `<div class="channel-category-icon"><i class="fa-solid fa-${iconClass}"></i></div>`;

                const yearBadgeHtml = ch.year ? `<span class="year-badge">${ch.year}</span>` : '';
                
                // Formato del subtítulo con el año integrado
                const groupSubtitle = ch.year 
                    ? `<i class="fa-solid fa-folder" style="font-size:10px; margin-right:4px;"></i>${ch.group} <span class="group-year-tag">• ${ch.year}</span>` 
                    : `<i class="fa-solid fa-folder" style="font-size:10px; margin-right:4px;"></i>${ch.group}`;

                item.innerHTML = `
                    ${logoHtml}
                    <div class="channel-details">
                        <div class="channel-title-row">
                            <div class="channel-title">${ch.title}</div>
                            ${yearBadgeHtml}
                        </div>
                        <div class="channel-group">${groupSubtitle}</div>
                    </div>
                `;
                channelList.appendChild(item);
            });
        }

        // Filtrar canales o películas por texto y por año seleccionado
        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = activeChannels.filter(ch => {
                const matchesText = ch.title.toLowerCase().includes(query) || 
                                    ch.group.toLowerCase().includes(query) ||
                                    (ch.year && ch.year.includes(query));
                
                const matchesYear = (selectedYearFilter === 'todos') || (ch.year === selectedYearFilter);

                return matchesText && matchesYear;
            });

            renderChannels(filtered);
        }

        // Reproducir HLS o transmisión de video
        function playStream(channel) {
            const playerView = document.getElementById('playerView');
            const video = document.getElementById('videoPlayer');
            document.getElementById('playingTitle').innerText = channel.title + (channel.year ? ` (${channel.year})` : '');
            document.getElementById('playingGroup').innerText = `${channel.group} ${channel.year ? '• ' + channel.year : ''} - RAYKO PLAY`;

            playerView.classList.add('active');

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay interceptado:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                video.src = channel.url;
                video.play().catch(e => console.log("Error al reproducir fuente:", e));
            }
        }

        function closePlayer() {
            playSelectSound();
            const video = document.getElementById('videoPlayer');
            video.pause();
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            document.getElementById('playerView').classList.remove('active');
        }

        function closeModal() {
            playSelectSound();
            document.getElementById('contentModal').classList.remove('active');
        }
    </script>
</body>
