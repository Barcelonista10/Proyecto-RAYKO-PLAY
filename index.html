<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY - Servidores M3U</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <!-- HLS.js para reproducción de video streaming en directo -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: #08080a;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor principal estilo pantalla móvil */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 440px;
            max-height: 900px;
            background: radial-gradient(circle at 50% 20%, #1a080a 0%, #0c0507 50%, #050304 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 22px 24px 22px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
            scrollbar-width: none;
        }
        .app-container::-webkit-scrollbar {
            display: none;
        }

        /* Encabezado RAYKO PLAY */
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 10px;
        }

        .main-title {
            font-family: 'Oswald', 'Montserrat', sans-serif;
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .title-rayko {
            color: #e6e6e6;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        .title-play {
            color: #ff0015;
            text-shadow: 0 0 15px rgba(255, 0, 21, 0.8), 0 0 30px rgba(255, 0, 21, 0.5);
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 5px;
            color: #a0a0a8;
            margin-top: 12px;
            text-transform: uppercase;
        }

        /* Lista de Menús / Botones */
        .menu-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Estilo base de los botones */
        .btn-card {
            width: 100%;
            height: 82px;
            background: linear-gradient(180deg, #1c1c20 0%, #121215 100%);
            border-radius: 26px;
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 22px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: none;
        }

        .btn-card:hover {
            transform: translateY(-2px) scale(1.01);
        }

        .btn-card:active {
            transform: scale(0.97);
        }

        /* Bordes Neón Rojo (Servidor 1, Películas Plus, Series) */
        .btn-card.border-red {
            border-top: 2px solid #ff0022;
            border-bottom: 2px solid #ff0022;
            box-shadow: 0 0 15px rgba(255, 0, 34, 0.35), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-red::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: #ff4d6d;
            box-shadow: 0 0 10px #ff0022;
        }

        /* Bordes Blanco / Plateado (Servidor 2, Películas Colección) */
        .btn-card.border-silver {
            border-top: 2px solid #e0e0e6;
            border-bottom: 2px solid #b0b0b8;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15), 0 8px 20px rgba(0, 0, 0, 0.7);
        }

        .btn-card.border-silver::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 25%;
            right: 25%;
            height: 2px;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Iconos de los botones */
        .btn-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 32px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
        }

        /* Texto dentro de los botones */
        .btn-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Modal para Contenidos */
        .content-modal {
            position: absolute;
            inset: 0;
            background: #07070b;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            transform: translateY(30px);
        }

        .content-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 0, 34, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #ff0022;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Buscador */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            background: #12121a;
            border: 1px solid #282838;
            border-radius: 12px;
            padding: 12px 16px 12px 42px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #ff0022;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 14px;
        }

        /* Indicador de Carga */
        .loader-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            gap: 16px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,0,34,0.2);
            border-top: 3px solid #ff0022;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Lista de Canales */
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #ff0022 #12121a;
        }

        .channel-item {
            background: #121218;
            border: 1px solid #20202a;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover, .channel-item:active {
            background: #1c1c28;
            border-color: #ff0022;
            transform: translateX(4px);
        }

        .channel-logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: #1e1e28;
            object-fit: contain;
            padding: 4px;
            flex-shrink: 0;
        }

        /* Contenedor de Icono Dorado/Naranja por Categoría */
        .channel-category-icon {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background: rgba(255, 157, 0, 0.08);
            border: 1px solid rgba(255, 157, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff9d00;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .channel-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .channel-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-group {
            font-size: 12px;
            color: #888899;
            margin-top: 2px;
        }

        /* Reproductor Modal */
        .player-view {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .player-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        .video-container {
            width: 100%;
            height: 250px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-close-player {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
        }

        .player-info {
            padding: 20px;
            flex: 1;
            background: #0b0b10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playing-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .playing-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 0, 34, 0.2);
            color: #ff0022;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            width: fit-content;
        }

        /* Notificación Toast */
        .toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff0022;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(255, 0, 34, 0.5);
            z-index: 300;
            transition: transform 0.3s ease;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Logotipo Superior RAYKO PLAY -->
        <header class="logo-container">
            <h1 class="main-title">
                <span class="title-rayko">RAYKO</span>
                <span class="title-play">PLAY</span>
            </h1>
            <p class="subtitle">ENTRETENIMIENTO FREEMIUM</p>
        </header>

        <!-- Lista de Secciones principales -->
        <main class="menu-list">

            <!-- 1. SERVIDOR 1 (Icono de TV) -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="loadM3uServer(1)">
                <div class="btn-icon" style="color: #60a5fa;">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <div class="btn-text">SERVIDOR 1</div>
            </div>

            <!-- 2. SERVIDOR 2 (Icono de Transmisión/Antena de Servidor) -->
            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="loadM3uServer(2)">
                <div class="btn-icon" style="color: #38bdf8;">
                    <i class="fa-solid fa-tower-broadcast"></i>
                </div>
                <div class="btn-text">SERVIDOR 2</div>
            </div>

            <!-- 3. PELÍCULAS PLUS -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="openDummySection('PELÍCULAS PLUS')">
                <div class="btn-icon" style="color: #9ca3af;">
                    <i class="fa-solid fa-video"></i>
                </div>
                <div class="btn-text">PELÍCULAS PLUS</div>
            </div>

            <!-- 4. PELÍCULAS COLECCIÓN -->
            <div class="btn-card border-silver" onmouseenter="playHoverSound()" onclick="openDummySection('PELÍCULAS COLECCIÓN')">
                <div class="btn-icon" style="color: #d1d5db;">
                    <i class="fa-solid fa-film"></i>
                </div>
                <div class="btn-text">PELÍCULAS COLECCIÓN</div>
            </div>

            <!-- 5. SERIES -->
            <div class="btn-card border-red" onmouseenter="playHoverSound()" onclick="openDummySection('SERIES')">
                <div class="btn-icon" style="color: #38bdf8;">
                    <i class="fa-solid fa-masks-theater"></i>
                </div>
                <div class="btn-text">SERIES</div>
            </div>

        </main>

        <!-- Modal de Canales -->
        <div class="content-modal" id="contentModal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">
                    <i class="fa-solid fa-tv"></i> SERVIDOR 1
                </div>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Buscador de canales -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Buscar por canal o categoría..." oninput="filterChannels()">
            </div>

            <!-- Loader / Lista de canales -->
            <div id="loader" class="loader-box">
                <div class="spinner"></div>
                <span>Cargando lista M3U...</span>
            </div>

            <div class="channel-list" id="channelList" style="display: none;"></div>
        </div>

        <!-- Vista Reproductor HLS -->
        <div class="player-view" id="playerView">
            <div class="video-container">
                <button class="btn-close-player" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
                <video id="videoPlayer" controls autoplay playsinline></video>
            </div>
            <div class="player-info">
                <div class="playing-badge">
                    <i class="fa-solid fa-signal"></i> TRANSMISIÓN EN VIVO
                </div>
                <div class="playing-title" id="playingTitle">Canal</div>
                <p id="playingGroup" style="font-size: 13px; color: #888;">Servidor M3U</p>
            </div>
        </div>

        <!-- Toast Message -->
        <div class="toast" id="toastMessage">Obteniendo canales...</div>

    </div>

    <!-- Script de Integración M3U, Sonidos & Player -->
    <script>
        // URLs de los servidores M3U (Modificables manualmente)
        const M3U_URL_SERVER1 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";
        const M3U_URL_SERVER2 = "https://raw.githubusercontent.com/Barcelonista10/Proyecto-RAYKO-PLAY/refs/heads/main/Lista%20Premium1.m3u";

        let serverCache = {
            1: [],
            2: []
        };
        let currentServer = 1;
        let activeChannels = [];
        let hlsInstance = null;

        // Contexto de Audio Web Sintetizado para efectos sonoros
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Sonido de pasar sobre la tarjeta (Hover / Navigation)
        function playHoverSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        // Sonido al presionar / seleccionar tarjeta (Click / Select)
        function playSelectSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        // Función para obtener el icono FontAwesome exacto según el nombre del canal o la categoría
        function getCategoryIcon(groupName, titleName = '') {
            const text = (groupName + ' ' + titleName).toLowerCase();
            
            if (text.includes('deport') || text.includes('sport') || text.includes('espn') || text.includes('fox') || text.includes('liga') || text.includes('win') || text.includes('gol')) {
                return 'fa-trophy'; // Trofeo para Deportes
            }
            if (text.includes('noticia') || text.includes('news') || text.includes('info') || text.includes('24') || text.includes('cnn')) {
                return 'fa-newspaper'; // Periódico para Noticias
            }
            if (text.includes('music') || text.includes('música') || text.includes('hit') || text.includes('mtv') || text.includes('radio')) {
                return 'fa-music'; // Nota Musical para Música
            }
            if (text.includes('docu') || text.includes('cultur') || text.includes('geo') || text.includes('discovery') || text.includes('history') || text.includes('planet')) {
                return 'fa-globe'; // Globo terráqueo para Documentales/Cultura
            }
            if (text.includes('serie') || text.includes('novel') || text.includes('dram')) {
                return 'fa-masks-theater'; // Máscaras para Series
            }
            if (text.includes('cine') || text.includes('pelicula') || text.includes('movie') || text.includes('hbo') || text.includes('star') || text.includes('estreno')) {
                return 'fa-clapperboard'; // Claqueta para Cine/Películas
            }
            if (text.includes('infantil') || text.includes('kid') || text.includes('anim') || text.includes('disney') || text.includes('cartoon') || text.includes('nick')) {
                return 'fa-child'; // Niños/Infantil
            }
            if (text.includes('adult') || text.includes('18') || text.includes('xxx')) {
                return 'fa-lock';
            }
            
            return 'fa-tv'; // Televisor por defecto para General/Entretenimiento
        }

        // Cargar Lista M3U para Servidores
        async function loadM3uServer(serverNum) {
            playSelectSound();
            currentServer = serverNum;
            const modal = document.getElementById('contentModal');
            const loader = document.getElementById('loader');
            const channelList = document.getElementById('channelList');
            const searchInput = document.getElementById('searchInput');
            const targetUrl = serverNum === 1 ? M3U_URL_SERVER1 : M3U_URL_SERVER2;

            document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-${serverNum === 1 ? 'tv' : 'tower-broadcast'}"></i> SERVIDOR ${serverNum}`;
            modal.classList.add('active');
            searchInput.value = '';

            if (serverCache[serverNum].length > 0) {
                activeChannels = serverCache[serverNum];
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);
                return;
            }

            loader.style.display = 'flex';
            channelList.style.display = 'none';

            try {
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error("Error al descargar lista M3U");
                const text = await response.text();
                
                serverCache[serverNum] = parseM3U(text);
                activeChannels = serverCache[serverNum];
                
                loader.style.display = 'none';
                channelList.style.display = 'flex';
                renderChannels(activeChannels);
                showToast(`Servidor ${serverNum}: ${activeChannels.length} canales cargados`);
            } catch (error) {
                console.error(error);
                loader.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="font-size:32px; color:#ff0022;"></i><span>Error al cargar Servidor ${serverNum}</span>`;
            }
        }

        // Parseador de formato M3U
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};

                    // Extraer logo si existe tvg-logo="..."
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    if (logoMatch && logoMatch[1]) {
                        currentChannel.logo = logoMatch[1];
                    }

                    // Extraer grupo si existe group-title="..."
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    if (groupMatch && groupMatch[1]) {
                        currentChannel.group = groupMatch[1];
                    } else {
                        currentChannel.group = "General";
                    }

                    // Extraer Nombre del Canal (después de la coma)
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentChannel.title = line.substring(commaIndex + 1).trim();
                    } else {
                        currentChannel.title = "Canal Sin Nombre";
                    }
                } else if (line.length > 0 && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        // Renderizar canales en la interfaz con sonido de hover/select
        function renderChannels(channels) {
            const channelList = document.getElementById('channelList');
            channelList.innerHTML = '';

            if (channels.length === 0) {
                channelList.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">No se encontraron canales</div>`;
                return;
            }

            channels.forEach((ch) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.onmouseenter = playHoverSound;
                item.onclick = () => {
                    playSelectSound();
                    playStream(ch);
                };

                const iconClass = getCategoryIcon(ch.group, ch.title);

                const logoHtml = ch.logo ? 
                    `<img class="channel-logo" src="${ch.logo}" alt="Logo" onerror="this.onerror=null; this.outerHTML='<div class=\\'channel-category-icon\\'><i class=\\'fa-solid ${iconClass}\\'></i></div>';">` :
                    `<div class="channel-category-icon"><i class="fa-solid ${iconClass}"></i></div>`;

                item.innerHTML = `
                    ${logoHtml}
                    <div class="channel-details">
                        <div class="channel-title">${ch.title}</div>
                        <div class="channel-group"><i class="fa-solid fa-folder" style="font-size:10px; margin-right:4px;"></i>${ch.group}</div>
                    </div>
                `;
                channelList.appendChild(item);
            });
        }

        // Filtrar canales por término de búsqueda
        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = activeChannels.filter(ch => 
                ch.title.toLowerCase().includes(query) || 
                ch.group.toLowerCase().includes(query)
            );
            renderChannels(filtered);
        }

        // Reproducir señal de video HLS
        function playStream(channel) {
            const playerView = document.getElementById('playerView');
            const video = document.getElementById('videoPlayer');
            document.getElementById('playingTitle').innerText = channel.title;
            document.getElementById('playingGroup').innerText = `${channel.group} - Servidor ${currentServer}`;

            playerView.classList.add('active');

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(channel.url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Autoplay interceptado:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Para iOS Safari
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                showToast("Tu navegador no soporta reproducción HLS");
            }
        }

        function closePlayer() {
            playSelectSound();
            const video = document.getElementById('videoPlayer');
            video.pause();
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            document.getElementById('playerView').classList.remove('active');
        }

        function closeModal() {
            playSelectSound();
            document.getElementById('contentModal').classList.remove('active');
        }

        function openDummySection(title) {
            playSelectSound();
            showToast(`Sección ${title} próximamente disponible`);
        }

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toastMessage');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
