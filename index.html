<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV PREMIUM</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:#080b12;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 height:65px;
 background:#101522;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 border-bottom:1px solid #202a3c;
 position:sticky;
 top:0;
 z-index:10;
}

.logo{
 font-size:23px;
 font-weight:bold;
 color:#00d9ff;
}

.logo span{
 color:white;
}

.menu-btn{
 background:#1d293b;
 border:0;
 color:white;
 padding:10px 14px;
 border-radius:7px;
 cursor:pointer;
}

.container{
 display:flex;
 min-height:calc(100vh - 65px);
}

.sidebar{
 width:210px;
 background:#101522;
 padding:20px 12px;
}

.sidebar h3{
 color:#687991;
 font-size:12px;
 margin:15px 10px;
}

.category{
 padding:13px;
 border-radius:8px;
 margin-bottom:6px;
 cursor:pointer;
 color:#c5d0df;
}

.category:hover,
.category.active{
 background:#12394b;
 color:#00d9ff;
}

main{
 flex:1;
 padding:20px;
 min-width:0;
}

.section-title{
 margin-bottom:18px;
 font-size:21px;
}

.player-box{
 background:#000;
 border-radius:12px;
 overflow:hidden;
 border:1px solid #263449;
}

video{
 width:100%;
 aspect-ratio:16/9;
 display:block;
 background:#000;
}

.player-info{
 padding:15px;
 background:#111827;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.player-info h2{
 font-size:17px;
}

.fullscreen{
 background:#00bce4;
 border:0;
 color:#001018;
 padding:10px 15px;
 border-radius:6px;
 font-weight:bold;
 cursor:pointer;
}

.search{
 width:100%;
 background:#141d2c;
 border:1px solid #29364b;
 padding:14px;
 color:white;
 border-radius:8px;
 margin:25px 0 18px;
 outline:none;
}

.channels{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:14px;
}

.channel{
 background:#121a29;
 border:1px solid #263449;
 border-radius:10px;
 padding:18px 10px;
 text-align:center;
 cursor:pointer;
 transition:.2s;
}

.channel:hover,
.channel:focus{
 border-color:#00d9ff;
 background:#183047;
 transform:translateY(-3px);
 outline:none;
}

.channel-icon{
 font-size:35px;
 margin-bottom:12px;
}

.channel h3{
 font-size:14px;
}

.channel small{
 display:block;
 color:#00d9ff;
 margin-top:8px;
}

.live{
 color:#ff4545;
 font-size:11px;
 margin-top:8px;
}

@media(max-width:700px){

 .sidebar{
  width:65px;
  padding:15px 5px;
 }

 .sidebar h3{
  display:none;
 }

 .category{
  font-size:0;
  text-align:center;
  padding:15px 5px;
 }

 .category:first-letter{
  font-size:20px;
 }

 main{
  padding:12px;
 }

 .channels{
  grid-template-columns:repeat(2,1fr);
 }

 .player-info h2{
  font-size:14px;
 }

}

</style>
</head>

<body>

<header>
 <div class="logo">TV <span>PREMIUM</span></div>
 <button class="menu-btn">☰ MENU</button>
</header>

<div class="container">

<aside class="sidebar">

<h3>CATEGORÍAS</h3>

<div class="category active" onclick="filterChannels('Todos',this)">🏠 Todos</div>
<div class="category" onclick="filterChannels('Deportes',this)">⚽ Deportes</div>
<div class="category" onclick="filterChannels('Fútbol',this)">🏆 Fútbol</div>
<div class="category" onclick="filterChannels('Entretenimiento',this)">🎬 Entretenimiento</div>
<div class="category" onclick="filterChannels('Noticias',this)">📰 Noticias</div>

</aside>

<main>

<h2 class="section-title">📺 Televisión en vivo</h2>

<div class="player-box">

<video id="video" controls playsinline></video>

<div class="player-info">
 <h2 id="channelTitle">Selecciona un canal</h2>
 <button class="fullscreen" onclick="fullscreen()">⛶ Pantalla completa</button>
</div>

</div>

<input
 class="search"
 type="text"
 id="search"
 placeholder="🔎 Buscar canales..."
 oninput="searchChannels()"
>

<h2 class="section-title">Todos los canales</h2>

<div class="channels" id="channels"></div>

</main>
</div>

<script>

const channelList = [

{
 name:"ESPN",
 category:"Deportes",
 icon:"⚽",
 url:""
},

{
 name:"ESPN 1",
 category:"Deportes",
 icon:"🏆",
 url:""
},

{
 name:"Disney",
 category:"Entretenimiento",
 icon:"🎬",
 url:""
},

{
 name:"Fox Sports",
 category:"Deportes",
 icon:"🏅",
 url:""
},

{
 name:"Disney 2",
 category:"Entretenimiento",
 icon:"📺",
 url:""
},

{
 name:"Noticias",
 category:"Noticias",
 icon:"📰",
 url:""
}

];

let currentCategory="Todos";
let hls=null;

function renderChannels(){

 const container=document.getElementById("channels");
 container.innerHTML="";

 const search=document.getElementById("search").value.toLowerCase();

 channelList.forEach((channel,index)=>{

  if(currentCategory!=="Todos" &&
     channel.category!==currentCategory)return;

  if(!channel.name.toLowerCase().includes(search))return;

  const card=document.createElement("div");

  card.className="channel";
  card.tabIndex=0;

  card.innerHTML=`
   <div class="channel-icon">${channel.icon}</div>
   <h3>${channel.name}</h3>
   <div class="live">● EN VIVO</div>
  `;

  card.onclick=()=>playChannel(index);

  card.onkeydown=(e)=>{
   if(e.key==="Enter")playChannel(index);
  };

  container.appendChild(card);

 });

}

function filterChannels(category,element){

 currentCategory=category;

 document.querySelectorAll(".category").forEach(c=>{
  c.classList.remove("active");
 });

 element.classList.add("active");

 renderChannels();

}

function searchChannels(){
 renderChannels();
}

function playChannel(index){

 const channel=channelList[index];

 if(!channel.url){
  alert("Este canal todavía no tiene una señal configurada.");
  return;
 }

 const video=document.getElementById("video");

 document.getElementById("channelTitle").textContent=channel.name;

 if(hls){
  hls.destroy();
  hls=null;
 }

 if(Hls.isSupported()){

  hls=new Hls();

  hls.loadSource(channel.url);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
   video.play().catch(()=>{});
  });

 }else if(video.canPlayType("application/vnd.apple.mpegurl")){

  video.src=channel.url;
  video.play().catch(()=>{});

 }

}

function fullscreen(){

 const video=document.getElementById("video");

 if(video.requestFullscreen){
  video.requestFullscreen();
 }else if(video.webkitEnterFullscreen){
  video.webkitEnterFullscreen();
 }

}

renderChannels();

</script>

</body>
</html>
