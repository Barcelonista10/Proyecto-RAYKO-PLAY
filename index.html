<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYKO PLAY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: #ffffff;
            user-select: none;
            overflow-x: hidden;
        }

        /* Red Neon Glow Effects */
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(255, 0, 0, 0.3);
            border-color: #ff1a1a;
        }

        .neon-text-red {
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.5);
        }

        /* Menu Button Styling mimicking original image */
        .zeus-btn {
            background: linear-gradient(180deg, #1c1d22 0%, #0f1013 100%);
            border: 2px solid transparent;
            position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Top red highlight glow bar like image */
        .zeus-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff0000, 0 0 20px #ff0000;
            opacity: 0.9;
        }

        /* Hover & Focus State for TV Remote navigation */
        .zeus-btn:hover, .zeus-btn.focused {
            transform: scale(1.03);
            background: linear-gradient(180deg, #25272e 0%, #15161b 100%);
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7), inset 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .zeus-btn:hover::before, .zeus-btn.focused::before {
            left: 5%;
            right: 5%;
            height: 4px;
            box-shadow: 0 0 18px #ff0000, 0 0 30px #ff0000;
        }

        /* Ambient background glow */
        .ambient-red {
            background: radial-gradient(circle, rgba(200, 0, 0, 0.18) 0%, rgba(5, 5, 5, 0.95) 70%);
        }

        /* Glassmorphism modals */
        .glass-modal {
            background: rgba(12, 12, 15, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 0, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 ambient-red relative">

    <!-- Top Status Bar -->
    <header class="w-full max-w-md flex justify-between items-center text-xs text-zinc-400 pt-2 px-2 z-10">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
            <span class="font-bold text-zinc-300">SERVIDOR ACTIVO</span>
        </div>
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-wifi text-zinc-300"></i>
            <span id="clock" class="font-semibold text-white">00:00</span>
        </div>
    </header>

    <!-- Main Container replicating image layout -->
    <main class="w-full max-w-md flex flex-col items-center my-auto py-4 z-10">

        <!-- LOGO BRANDING -->
        <div class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-black tracking-wider uppercase text-white flex items-center justify-center gap-2">
                <span class="text-zinc-200">RAYKO</span> 
                <span class="text-red-600 neon-text-red">PLAY</span>
            </h1>
            <p class="text-[11px] sm:text-xs font-semibold tracking-[0.35em] text-zinc-400 mt-2 uppercase">
                CANALES EN VIVO
            </p>
        </div>

        <!-- MENU BUTTONS LIST -->
        <div class="w-full flex flex-col gap-4 sm:gap-5" id="menu-list">
            
            <!-- 
                🟢 CAMBIO CRUCIAL: 
                En lugar de pasar una clave inventada, pasamos el nombre de la categoría 
                que existe en tu JSON. EJEMPLOS: 'Deportes', 'Cine y Series', 'Eventos', etc.
                Si pones 'TODOS', se mostrarán todos los canales.
            -->

            <!-- OPCIÓN 1: TV EN VIVO (Muestra TODOS los canales) -->
            <button class="zeus-btn focused w-full py-4 px-6 rounded-3xl flex items-center gap-5 group cursor-pointer" data-index="0" onclick="openSection('TV EN VIVO', 'TODOS')">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50 group-hover:border-red-500/50">
                    <i class="fa-solid fa-tv text-2xl text-cyan-400 group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-wide text-white uppercase">
                    TV EN VIVO
                </span>
            </button>

            <!-- OPCIÓN 2: DEPORTES -->
            <button class="zeus-btn w-full py-4 px-6 rounded-3xl flex items-center gap-5 group cursor-pointer" data-index="1" onclick="openSection('DEPORTES', 'Deportes')">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50 group-hover:border-red-500/50">
                    <i class="fa-solid fa-futbol text-2xl text-zinc-300 group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-wide text-white uppercase">
                    DEPORTES
                </span>
            </button>

            <!-- OPCIÓN 3: CINE Y SERIES -->
            <button class="zeus-btn w-full py-4 px-6 rounded-3xl flex items-center gap-5 group cursor-pointer" data-index="2" onclick="openSection('CINE Y SERIES', 'Cine y Series')">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50 group-hover:border-red-500/50">
                    <i class="fa-solid fa-clapperboard text-2xl text-amber-400 group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-wide text-white uppercase">
                    CINE Y SERIES
                </span>
            </button>

            <!-- OPCIÓN 4: EVENTOS DESTACADOS -->
            <button class="zeus-btn w-full py-4 px-6 rounded-3xl flex items-center gap-5 group cursor-pointer" data-index="3" onclick="openSection('EVENTOS', 'Eventos')">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50 group-hover:border-red-500/50">
                    <i class="fa-solid fa-calendar-days text-2xl text-amber-600 group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-wide text-white uppercase">
                    EVENTOS
                </span>
            </button>

            <!-- OPCIÓN 5: GENERAL -->
            <button class="zeus-btn w-full py-4 px-6 rounded-3xl flex items-center gap-5 group cursor-pointer" data-index="4" onclick="openSection('GENERAL', 'General')">
                <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50 group-hover:border-red-500/50">
                    <i class="fa-solid fa-masks-theater text-2xl text-amber-500 group-hover:scale-110 transition-transform"></i>
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-wide text-white uppercase">
                    GENERAL
                </span>
            </button>

        </div>
    </main>

    <!-- TV Remote Control Guidance Footer -->
    <footer class="w-full max-w-md text-center py-2 z-10">
        <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-zinc-900/90 border border-zinc-800 text-[11px] text-zinc-400">
            <span><i class="fa-solid fa-arrows-up-down text-red-500"></i> Mover</span>
            <span class="text-zinc-600">•</span>
            <span><strong class="text-zinc-200">ENTER</strong> Seleccionar</span>
        </div>
    </footer>

    <!-- Interactive Content Modal -->
    <div id="content-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-modal w-full max-w-lg rounded-3xl p-6 relative flex flex-col max-h-[85vh] shadow-2xl border-red-600/40">
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-zinc-800 text-zinc-300 hover:text-white hover:bg-red-600 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Modal Header -->
            <div class="flex items-center gap-3 mb-4">
                <i class="fa-solid fa-circle-play text-red-500 text-2xl"></i>
                <h2 id="modal-title" class="text-xl font-black text-white uppercase tracking-wider">Categoría</h2>
            </div>

            <!-- Modal Body / Content List -->
            <div id="modal-content" class="overflow-y-auto space-y-3 pr-1 my-2 max-h-[60vh]">
                <!-- Dynamic Content Loaded via JS -->
            </div>

            <div class="pt-4 border-t border-zinc-800 text-center text-xs text-zinc-500">
                Pulse <span class="text-red-400 font-bold">ESC</span> o haga clic afuera para volver
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentIndex = 0;
        const buttons = document.querySelectorAll('.zeus-btn');
        const modal = document.getElementById('content-modal');
        let allChannels = []; // Aquí se guardará la lista real de la app

        // 🟢 1. LE PIDE LA LISTA DE CANALES A LA APP AL CARGAR
        function requestChannelsFromApp() {
            if (window.Android) {
                window.Android.sendChannelsToWeb();
            } else {
                setTimeout(() => { 
                    document.getElementById('channelList').innerHTML = '<div class="loading-text">Abre esta web desde la App RAYKO PLAY</div>';
                }, 1000);
            }
        }

        // 🟢 2. RECIBE LA LISTA EN FORMATO JSON DESDE LA APP
        function receiveChannelsFromApp(jsonData) {
            try {
                allChannels = JSON.parse(jsonData);
                console.log("Canales cargados desde la app: " + allChannels.length);
            } catch (e) {
                console.error("Error al recibir los canales", e);
            }
        }

        // Update focus state visually
        function updateFocus(index) {
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('focused');
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    btn.classList.remove('focused');
                }
            });
            currentIndex = index;
        }

        // Mouse hover support
        buttons.forEach((btn, index) => {
            btn.addEventListener('mouseenter', () => {
                updateFocus(index);
            });
        });

        // Remote Control Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (modal.classList.contains('hidden') === false) {
                if (e.key === 'Escape' || e.key === 'BackSpace') {
                    closeModal();
                }
                return;
            }

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                const nextIndex = (currentIndex + 1) % buttons.length;
                updateFocus(nextIndex);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                const prevIndex = (currentIndex - 1 + buttons.length) % buttons.length;
                updateFocus(prevIndex);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                buttons[currentIndex].click();
            }
        });

        // 🟢 3. NUEVA FUNCIÓN PARA ABRIR EL MENÚ CON FILTRO DINÁMICO
        function openSection(title, categoryFilter) {
            document.getElementById('modal-title').innerText = title;
            const container = document.getElementById('modal-content');
            container.innerHTML = '';

            // Si no hay canales en la app, mostramos un mensaje
            if (allChannels.length === 0) {
                container.innerHTML = `<div class="text-zinc-400 text-center py-4">Esperando canales de la app...</div>`;
                modal.classList.remove('hidden');
                return;
            }

            // Filtrar la lista de canales según la categoría
            let filteredItems = [];
            if (categoryFilter === 'TODOS') {
                filteredItems = allChannels; // Muestra todos si es TODOS
            } else {
                filteredItems = allChannels.filter(c => c.category === categoryFilter);
            }

            if (filteredItems.length === 0) {
                container.innerHTML = `<div class="text-zinc-400 text-center py-4">No hay canales en la categoría: ${categoryFilter}</div>`;
                modal.classList.remove('hidden');
                return;
            }
            
            // Renderizar la lista generada dinámicamente
            filteredItems.forEach(item => {
                const el = document.createElement('div');
                el.className = "flex items-center justify-between p-3.5 rounded-2xl bg-zinc-900/80 border border-zinc-800 hover:border-red-500 hover:bg-zinc-800 transition cursor-pointer group";
                
                // 🟢 AL HACER CLIC, LLAMA AL PUENTE DE LA APP CON EL NOMBRE DEL CANAL
                el.onclick = () => {
                    if (window.Android) {
                        window.Android.playChannelFromWeb(item.name);
                    } else {
                        alert(`Simulación: Iniciando reproducción de: ${item.name}`);
                    }
                };

                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-red-950/60 border border-red-600/30 flex items-center justify-center text-red-500 group-hover:bg-red-600 group-hover:text-white transition">
                            <i class="fa-solid fa-play text-sm"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-sm text-white">${item.name}</h4>
                            ${item.category ? `<p class="text-xs text-zinc-400">${item.category}</p>` : ''}
                        </div>
                    </div>
                    <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-amber-400 group-hover:border-red-500/60">
                        ${item.category || 'LIVE'}
                    </span>
                `;
                container.appendChild(el);
            });

            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        // Close on clicking backdrop
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Realtime Clock
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Inicializar pidiendo los canales a la app
        window.onload = function() {
            requestChannelsFromApp();
        };
    </script>
</body>
</html>
