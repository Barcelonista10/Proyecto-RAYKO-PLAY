<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY - Neo Cyber Entertainment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'cyber-dark': '#06070a',
                        'cyber-accent': '#ff0044',
                        'cyber-cyan': '#00f0ff',
                        'cyber-purple': '#7000ff',
                        'cyber-gold': '#ffb700',
                    },
                    boxShadow: {
                        'neon-red': '0 0 20px rgba(255, 0, 68, 0.4), 0 0 40px rgba(255, 0, 68, 0.1)',
                        'neon-cyan': '0 0 20px rgba(0, 240, 255, 0.4), 0 0 40px rgba(0, 240, 255, 0.1)',
                        'card-glow': '0 8px 32px 0 rgba(0, 0, 0, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

        body {
            background-color: #030305;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }

        .bg-grid {
            background-size: 30px 30px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .cyber-card {
            background: linear-gradient(135deg, rgba(20, 24, 33, 0.85) 0%, rgba(10, 12, 18, 0.95) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: 0.5s;
        }

        .cyber-card:hover::before, .cyber-card:active::before {
            left: 100%;
        }

        .cyber-card:active {
            transform: scale(0.98);
        }

        .cyber-border-red {
            border-left: 3px solid #ff0044;
        }
        .cyber-border-cyan {
            border-left: 3px solid #00f0ff;
        }
        .cyber-border-gold {
            border-left: 3px solid #ffb700;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff0044;
            border-radius: 10px;
        }

        @keyframes cyberPulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255,0,68,0.4), inset 0 0 15px rgba(255,0,68,0.2);
                border-color: rgba(255,0,68,0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(255,0,68,0.7), inset 0 0 20px rgba(255,0,68,0.4);
                border-color: rgba(255,0,68,1);
            }
        }

        @keyframes goldPulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255,183,0,0.4), inset 0 0 15px rgba(255,183,0,0.2);
                border-color: rgba(255,183,0,0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(255,183,0,0.7), inset 0 0 20px rgba(255,183,0,0.4);
                border-color: rgba(255,183,0,1);
            }
        }

        .pulse-neon {
            animation: cyberPulse 2.5s ease-in-out infinite;
        }

        .pulse-gold {
            animation: goldPulse 2.5s ease-in-out infinite;
        }

        @keyframes purplePulse {
            0%, 100% {
                box-shadow: 0 0 15px rgba(112,0,255,0.4), inset 0 0 15px rgba(112,0,255,0.2);
                border-color: rgba(112,0,255,0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(112,0,255,0.7), inset 0 0 20px rgba(112,0,255,0.4);
                border-color: rgba(112,0,255,1);
            }
        }

        .pulse-purple {
            animation: purplePulse 2.5s ease-in-out infinite;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(0, 240, 255, 0.3);
            position: absolute;
            top: 0; left: 0;
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 60;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-black">

    <div class="w-full max-w-md h-[100vh] sm:h-[880px] bg-cyber-dark sm:rounded-[44px] border-0 sm:border-[5px] border-zinc-800/80 shadow-card-glow flex flex-col justify-between relative overflow-hidden bg-grid">

        <div class="scanline"></div>

        <div class="absolute -top-24 -left-24 w-60 h-60 bg-cyber-accent/20 rounded-full blur-[80px] pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-cyber-cyan/15 rounded-full blur-[80px] pointer-events-none"></div>

        <div id="nav-header" class="hidden px-5 pt-4 pb-2 flex items-center justify-between z-50">
            <button onclick="goBack()" class="flex items-center space-x-2 text-white bg-zinc-900/90 hover:bg-zinc-800 px-3.5 py-1.5 rounded-xl border border-zinc-700/60 active:scale-95 transition shadow-lg backdrop-blur-md">

            <div class="flex items-center space-x-2">
                <span class="w-1.5 h-1.5 rounded-full bg-cyber-cyan"></span>
                <span id="current-screen-title" class="text-[11px] tracking-widest text-zinc-400 uppercase font-cyber font-semibold"></span>
            </div>
        </div>

        <!-- VISTA 1: MENÚ PRINCIPAL -->
        <div id="screen-home" class="screen active flex-col flex-1 px-5 py-6 justify-between overflow-y-auto z-10">

            <div class="text-center my-4 relative">
                <div class="inline-block relative">
                    <h1 class="text-4xl font-black tracking-wider text-white font-cyber italic">
                        RAYKO <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyber-accent to-cyber-cyan drop-shadow-[0_0_15px_rgba(255,0,68,0.8)]">PLAY</span>
                    </h1>
                </div>
                <div class="flex items-center justify-center space-x-2 mt-1">
                    <span class="h-[1px] w-6 bg-gradient-to-r from-transparent to-cyber-accent"></span>
                    <p class="text-[10px] text-zinc-400 font-cyber tracking-[0.3em] uppercase font-bold">ENTRETENIMIENTO GRATUITO</p>
                    <span class="h-[1px] w-6 bg-gradient-to-l from-transparent to-cyber-accent"></span>
                </div>
            </div>

            <div class="space-y-3.5 my-auto">
                <button onclick="navigateTo('screen-servers')" class="w-full cyber-card pulse-neon p-4 rounded-2xl flex items-center justify-between hover:border-cyber-accent/80 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-cyber-accent/20 to-black border border-cyber-accent/40 flex items-center justify-center text-xl text-cyber-accent shadow-inner group-hover:scale-105 transition">
                            <i class="fas fa-tv"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-base font-extrabold text-white tracking-wider font-cyber">TV EN VIVO</span>

                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-xs text-cyber-accent opacity-70 group-hover:translate-x-1 transition"></i>
                </button>

                <button onclick="showToast('Sección de Películas Estreno')" class="w-full cyber-card cyber-border-cyan p-4 rounded-2xl flex items-center justify-between hover:bg-zinc-900/60 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-zinc-900/90 border border-zinc-700/60 flex items-center justify-center text-xl text-cyber-cyan group-hover:scale-105 transition">
                            <i class="fas fa-film"></i>
                        </div>
                        <div class="text-left">

                <button onclick="openPeliculasPlus()" class="w-full cyber-card pulse-purple p-4 rounded-2xl flex items-center justify-between hover:bg-zinc-900/60 transition group">
                    <div class="flex items-center space-x-4">

                <button onclick="showToast('Sección de Películas Colección')" class="w-full cyber-card p-4 rounded-2xl flex items-center justify-between hover:bg-zinc-900/60 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-zinc-900/90 border border-zinc-700/60 flex items-center justify-center text-xl text-amber-400 group-hover:scale-105 transition">
                            <i class="fas fa-compact-disc"></i>
                        </div>
                        <div class="text-left">
                            <span class="block text-base font-bold text-white tracking-wider font-cyber">COLECCIÓN</span>
                            <span class="text-[11px] text-zinc-400">Sagas y Clásicos</span>

                    <i class="fas fa-chevron-right text-xs text-zinc-600 group-hover:translate-x-1 transition"></i>
                </button>

                <button onclick="showToast('Sección de Series')" class="w-full cyber-card p-4 rounded-2xl flex items-center justify-between hover:bg-zinc-900/60 transition group">
                    <div class="flex items-center space-x-4">

                    </div>
                    <i class="fas fa-chevron-right text-xs text-zinc-600 group-hover:translate-x-1 transition"></i>
                </button>
            </div>

            <div class="text-center py-2 flex flex-col items-center justify-center space-y-1">
                <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-zinc-800 to-transparent mb-1"></div>
                <span class="text-[10px] text-zinc-500 font-cyber tracking-widest uppercase">RAYKO PLAY FREEMIUM © 2026</span>
            </div>
        </div>

        <!-- VISTA 2: SERVIDORES TV -->
        <div id="screen-servers" class="screen flex-col flex-1 px-5 py-4 justify-between overflow-y-auto z-10">
            <div class="text-center my-4">
                <h1 class="text-2xl font-black tracking-wider text-white font-cyber uppercase">
                    SERVIDORES <span class="text-cyber-accent drop-shadow-[0_0_10px_rgba(255,0,68,0.8)]">TV</span>
                </h1>
                <p class="text-[10px] text-cyber-cyan font-cyber tracking-[0.25em] mt-1 uppercase">Selecciona un nodo de transmisión</p>
            </div>

            <div class="space-y-4 my-auto">
                <!-- SERVIDOR 1: FREEMIUM 1 (incluye Premium) -->
                <button onclick="loadServerChannels(1)" class="w-full cyber-card pulse-neon p-5 rounded-2xl flex items-center justify-between hover:bg-zinc-900 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-xl bg-cyber-accent/20 border border-cyber-accent flex items-center justify-center text-cyber-accent text-xl">
                                <i class="fas fa-server"></i>
                            </div>
                            <span class="absolute -top-1 -right-1 flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                            </span>
                        </div>
                        <div class="text-left">
                            <span class="block text-base font-extrabold text-white tracking-wider font-cyber">TV FREEMIUM 1</span>
                            <span class="text-[11px] text-emerald-400 font-mono">● EN LÍNEA (Principal)</span>
                        </div>
                    </div>
                    <i class="fas fa-play text-xs text-cyber-accent group-hover:translate-x-1 transition"></i>
                </button>

                <!-- SERVIDOR 2: FREEMIUM 2 (Cine y Series / respaldos) -->
                <button onclick="loadServerChannels(2)" class="w-full cyber-card cyber-border-cyan p-5 rounded-2xl flex items-center justify-between hover:bg-zinc-900 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-xl bg-cyber-cyan/20 border border-cyber-cyan flex items-center justify-center text-cyber-cyan text-xl">
                                <i class="fas fa-satellite"></i>
                            </div>
                            <span class="absolute -top-1 -right-1 flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span>
                            </span>
                        </div>
                        <div class="text-left">
                            <span class="block text-base font-extrabold text-white tracking-wider font-cyber">TV FREEMIUM 2</span>
                            <span class="text-[11px] text-cyber-cyan font-mono">● ONLINE (Respaldos)</span>
                        </div>
                    </div>
                    <i class="fas fa-play text-xs text-cyber-cyan group-hover:translate-x-1 transition"></i>
                </button>

                <!-- SERVIDOR 3: EVENTOS -->
                <button onclick="loadServerChannels(3)" class="w-full cyber-card pulse-gold p-5 rounded-2xl flex items-center justify-between hover:bg-zinc-900 transition group">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <div class="w-12 h-12 rounded-xl bg-amber-500/20 border border-amber-500 flex items-center justify-center text-amber-400 text-xl">
                                <i class="fas fa-trophy"></i>
                            </div>
                            <span class="absolute -top-1 -right-1 flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                            </span>
                        </div>
                        <div class="text-left">
                            <span class="block text-base font-extrabold text-white tracking-wider font-cyber">EVENTOS</span>
                            <span class="text-[11px] text-amber-400 font-mono">⚡ ESPECIALES & EN VIVO</span>
                        </div>
                    </div>
                    <i class="fas fa-bolt text-xs text-amber-400 group-hover:translate-x-1 transition"></i>
                </button>
            </div>

            <div class="text-center py-3">
                <span class="text-[10px] text-zinc-600 font-cyber tracking-widest uppercase">ESTADO DE RED: OPTIMIZADO</span>
            </div>
        </div>

        <!-- VISTA 3: PARRILLA DE CANALES -->
        <div id="screen-channels" class="screen flex-col flex-1 h-full overflow-hidden z-10">

            <div class="px-4 pt-2 pb-2 flex-none bg-cyber-dark/80 backdrop-blur-md">
                <div class="text-center mb-3">
                    <h2 class="text-lg font-black text-white font-cyber tracking-wider" id="server-channels-title">CANALES DISPONIBLES</h2>
                    <div class="flex items-center justify-center space-x-1.5">
                        <span id="server-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <p id="active-server-badge" class="text-[10px] text-cyber-cyan font-mono uppercase tracking-wider">Servidor Freemium 1 Activo</p>
                    </div>
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                        <i class="fas fa-search text-xs"></i>
                    </div>
                    <input
                        type="text"
                        id="channel-search"
                        oninput="filterChannels()"
                        placeholder="Buscar canal o evento..."
                        class="w-full bg-zinc-900/90 border border-zinc-700/80 text-white placeholder-zinc-500 text-xs rounded-xl pl-9 pr-8 py-2.5 focus:outline-none focus:border-cyber-accent focus:ring-1 focus:ring-cyber-accent transition backdrop-blur-md"
                    >
                    <button id="clear-search" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-white">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-2">
                <div id="channels-grid" class="grid grid-cols-2 gap-3 pb-6">
                </div>

                <div id="no-results" class="hidden text-center py-12">
                    <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-3 text-zinc-600 text-2xl">
                        <i class="fas fa-search-minus"></i>
                    </div>
                    <p class="text-zinc-400 text-xs font-cyber">No se encontraron coincidencias</p>
                </div>
            </div>

        </div>

        <div id="toast" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-900/95 border border-cyber-accent/60 text-white px-5 py-2.5 rounded-2xl text-xs font-semibold shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2.5 backdrop-blur-md">
            <i class="fas fa-info-circle text-cyber-accent text-sm"></i>
            <span id="toast-message" class="tracking-wide">Mensaje</span>
        </div>

    </div>

    <script>
        let allChannels = [];
        let currentServer = 1;
        let currentCategoryFilter = null; // filtro exclusivo por categoría (no usado por Películas Plus)

        // Llamada desde la app Android para cargar la lista global de canales
        function receiveChannelsFromApp(jsonData) {
            try {
                allChannels = JSON.parse(jsonData);
                console.log("Canales cargados desde la App: " + allChannels.length);
                if (document.getElementById('screen-channels').classList.contains('active')) {
                    renderChannels();
                }
            } catch (e) {
                console.error("Error al analizar los canales", e);
            }
        }

        // Cada botón de servidor muestra solo su categoría de canal
        const SERVER_CATEGORY_MAP = {
            1: "Premium",       // Freemium 1 -> canales Premium
            2: "Cine y Series", // Freemium 2 -> respaldos
            3: "Eventos"        // Eventos
        };

        function getChannelsForServer(serverNum) {
            if (currentCategoryFilter) {
                return allChannels.filter(ch => ch.category === currentCategoryFilter);
            }
            const category = SERVER_CATEGORY_MAP[serverNum];
            if (!category) return allChannels;
            return allChannels.filter(ch => ch.category === category);
        }

        // Carga el servidor seleccionado (1, 2 o 3 para Eventos)
        function loadServerChannels(serverNum = 1) {
            currentCategoryFilter = null; // limpia cualquier filtro de categoría al usar TV EN VIVO
            currentServer = serverNum;

            if (allChannels.length === 0) {
                showToast("Esperando datos de la App...");
                if (window.Android) {
                    window.Android.sendChannelsToWeb();
                }
                if (!window.Android) {
                    navigateTo('screen-channels');
                    updateServerBadge(serverNum);
                    renderChannels();
                }
                return;
            }

            navigateTo('screen-channels');
            updateServerBadge(serverNum);
            renderChannels();
        }

        // Carga canales filtrados por una categoría exacta (disponible para futuras secciones)
        function loadCategoryChannels(category, screenTitle) {
            currentCategoryFilter = category;
            currentServer = null;

            if (allChannels.length === 0) {
                showToast("Esperando datos de la App...");
                if (window.Android) {
                    window.Android.sendChannelsToWeb();
                }
                if (!window.Android) {
                    navigateTo('screen-channels');
                    updateCategoryBadge(screenTitle);
                    renderChannels();
                }
                return;
            }

            navigateTo('screen-channels');
            updateCategoryBadge(screenTitle);
            renderChannels();
        }

        // PELÍCULAS PLUS: abre la web (stream4fun.net) directamente en el WebView de la app,
        // en lugar de filtrar canales. No usa allChannels ni la parrilla.
        function openPeliculasPlus() {
            if (window.Android) {
                window.Android.openPeliculasPlus();
            } else {
                // Modo navegador (fuera de la app): abre en una pestaña nueva
                window.open('https://stream4fun.net/', '_blank');
            }
        }

        function updateServerBadge(serverNum) {
            const badge = document.getElementById('active-server-badge');
            const dot = document.getElementById('server-status-dot');
            const title = document.getElementById('server-channels-title');

            if (serverNum === 1) {
                title.textContent = "CANALES DISPONIBLES";
                badge.textContent = "Servidor Freemium 1 Activo";
                badge.className = "text-[10px] text-cyber-cyan font-mono uppercase tracking-wider";
                dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
            } else if (serverNum === 2) {
                title.textContent = "CANALES DISPONIBLES";
                badge.textContent = "Servidor Freemium 2 Activo";
                badge.className = "text-[10px] text-cyber-cyan font-mono uppercase tracking-wider";
                dot.className = "w-1.5 h-1.5 rounded-full bg-cyan-400";
            } else if (serverNum === 3) {
                title.textContent = "EVENTOS Y TRANSMISIONES";
                badge.textContent = "Servidor de Eventos Activo";
                badge.className = "text-[10px] text-amber-400 font-mono uppercase tracking-wider";
                dot.className = "w-1.5 h-1.5 rounded-full bg-amber-400";
            }
        }

        // Badge/título para vistas filtradas por categoría (disponible para futuras secciones)
        function updateCategoryBadge(screenTitle) {
            const badge = document.getElementById('active-server-badge');
            const dot = document.getElementById('server-status-dot');
            const title = document.getElementById('server-channels-title');

            title.textContent = screenTitle;
            badge.textContent = screenTitle + " Activo";
            badge.className = "text-[10px] text-purple-400 font-mono uppercase tracking-wider";
            dot.className = "w-1.5 h-1.5 rounded-full bg-purple-400";
        }

        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '';
            const noResults = document.getElementById('no-results');
            noResults.classList.add('hidden');

            const channels = getChannelsForServer(currentServer);

            if (channels.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 text-center py-12 text-zinc-500 text-xs font-cyber">
                        <i class="fas fa-satellite-dish text-3xl mb-3 block text-zinc-600"></i>
                        No hay transmisiones disponibles en este servidor.
                    </div>
                `;
                return;
            }

            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = "channel-card cyber-card rounded-2xl p-2.5 flex flex-col justify-between border border-zinc-800/80 hover:border-cyber-accent/50 transition";
                card.setAttribute('data-name', ch.name.toLowerCase());

                let logoHtml = '';
                if (ch.logoUrl && ch.logoUrl.trim() !== '' && ch.logoUrl !== 'default_icon') {
                    logoHtml = `<img src="${ch.logoUrl}" alt="${ch.name}" class="max-h-16 max-w-full object-contain transition-transform duration-300 hover:scale-105" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-white font-bold text-center tracking-wider text-xs font-cyber\\'>${ch.name}</div>'"/>`;
                } else {
                    logoHtml = `
                        <div class="flex flex-col items-center justify-center w-full h-full bg-zinc-950/80 rounded-xl p-1 border border-zinc-800/50">
                            <span class="text-cyber-accent text-xl font-black font-cyber tracking-tight drop-shadow-[0_0_8px_rgba(255,0,68,0.8)]">RAYKO</span>
                            <span class="text-white text-[9px] font-bold tracking-[0.2em] -mt-1 font-cyber">PLAY</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="w-full h-20 flex items-center justify-center p-2 rounded-xl bg-zinc-950/60 overflow-hidden relative border border-zinc-800/40">
                        ${logoHtml}
                    </div>
                    <div class="mt-2 text-center">
                        <p class="text-[11px] font-bold text-zinc-200 truncate font-cyber mb-1.5 px-1">${ch.name}</p>
                        <button onclick="playChannel('${ch.name.replace(/'/g, "\\'")}')" class="w-full bg-gradient-to-r from-cyber-accent to-red-600 hover:from-red-600 hover:to-cyber-accent text-white font-extrabold py-1.5 px-2 rounded-lg text-[10px] font-cyber uppercase tracking-wider transition active:scale-95 shadow-md flex items-center justify-center space-x-1">
                            <i class="fas fa-play text-[9px]"></i>
                            <span>VER CANAL</span>
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function playChannel(channelName) {
            showToast(`Cargando transmisión: ${channelName}`);
            if (window.Android) {
                window.Android.playChannelFromWeb(channelName);
            } else {
                console.log("Modo navegador: reproduciendo " + channelName);
            }
        }

        const navigationHistory = ['screen-home'];

        function navigateTo(screenId) {
            const currentScreen = navigationHistory[navigationHistory.length - 1];
            if (currentScreen === screenId) return;

            document.getElementById(currentScreen).classList.remove('active');

            navigationHistory.push(screenId);
            const nextScreen = document.getElementById(screenId);
            nextScreen.classList.add('active');

            updateHeader();
        }

        function goBack() {
            if (navigationHistory.length <= 1) return;
            const currentScreen = navigationHistory.pop();
            document.getElementById(currentScreen).classList.remove('active');
            const previousScreen = navigationHistory[navigationHistory.length - 1];
            document.getElementById(previousScreen).classList.add('active');
            updateHeader();
        }

        function updateHeader() {
            const header = document.getElementById('nav-header');
            const titleSpan = document.getElementById('current-screen-title');
            const currentScreen = navigationHistory[navigationHistory.length - 1];

            if (currentScreen === 'screen-home') {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                if (currentScreen === 'screen-servers') {
                    titleSpan.textContent = 'Servidores';
                } else if (currentScreen === 'screen-channels') {
                    if (currentCategoryFilter) {
                        titleSpan.textContent = currentCategoryFilter;
                    } else {
                        titleSpan.textContent = currentServer === 3 ? 'Eventos TV' : 'Parrilla TV';
                    }
                }
            }
        }

        function filterChannels() {
            const query = document.getElementById('channel-search').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.channel-card');
            const clearBtn = document.getElementById('clear-search');
            const noResults = document.getElementById('no-results');
            let visibleCount = 0;

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            cards.forEach(card => {
                const channelName = card.getAttribute('data-name');
                if (channelName.includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        function clearSearch() {
            const searchInput = document.getElementById('channel-search');
            searchInput.value = '';
            filterChannels();
            searchInput.focus();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Android) {
                window.Android.sendChannelsToWeb();
            }
        });
    </script>
</body>
</html>
