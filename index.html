<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAYKO PLAY - Entretenimiento Freemium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#000000', /* Cambiado a negro puro */
                        'card-bg': '#141414',
                        'neon-red': '#ff002b',
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(255, 0, 43, 0.6), 0 0 30px rgba(255, 0, 43, 0.3)',
                        'neon-glow': '0 0 20px rgba(255, 0, 50, 0.75)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000; /* Fondo negro puro para igualar la captura */
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilos específicos de borde tipo app */
        .app-card {
            background: #121212;
            border-radius: 24px;
            border: 1.5px solid #2a2a2a;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255, 0, 43, 0.8) 0%, transparent 50%, rgba(255, 0, 43, 0.4) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Transición suave de pantallas */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Animación pulso neón */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255,0,43,0.5), 0 0 20px rgba(255,0,43,0.3);
            }
            50% {
                box-shadow: 0 0 18px rgba(255,0,43,0.8), 0 0 30px rgba(255,0,43,0.5);
            }
        }

        .pulse-glow {
            animation: pulseGlow 2.5s infinite;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-black">

    <!-- Mockup de Contenedor Móvil/TV para la APK -->
    <div class="w-full max-w-md h-[100vh] sm:h-[880px] bg-black sm:rounded-[40px] border-0 sm:border-[6px] border-[#222] shadow-2xl flex flex-col justify-between relative overflow-hidden">
        
        <!-- Barra superior simulada -->
        <div class="w-full pt-3 px-6 flex justify-between items-center text-xs text-gray-400 z-50">
            <span id="clock">12:00</span>
            <div class="flex items-center space-x-2">
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Botón Volver (Global cuando no está en Home) -->
        <div id="nav-header" class="hidden px-5 pt-2 pb-1 flex items-center justify-between z-40">
            <button onclick="goBack()" class="flex items-center space-x-2 text-white bg-zinc-900/80 px-3 py-1.5 rounded-full border border-zinc-700 active:scale-95 transition">
                <i class="fas fa-arrow-left text-sm text-red-500"></i>
                <span class="text-xs font-semibold">Atrás</span>
            </button>
            <span id="current-screen-title" class="text-xs tracking-wider text-gray-400 uppercase font-mono"></span>
        </div>

        <!-- VISTA 1: MENÚ PRINCIPAL (RAYKO PLAY) -->
        <div id="screen-home" class="screen active flex-col flex-1 px-5 py-4 justify-between overflow-y-auto">
            <!-- Header Logo -->
            <div class="text-center my-4">
                <h1 class="text-4xl font-extrabold tracking-wide text-white inline-flex items-center gap-2">
                    RAYKO <span class="text-red-600 drop-shadow-[0_0_12px_rgba(255,0,43,0.9)]">PLAY</span>
                </h1>
                <p class="text-xs text-gray-400 font-mono tracking-[0.25em] mt-2 uppercase">
                    ENTRETENIMIENTO FREEMIUM
                </p>
            </div>

            <!-- Botones del Menú Principal -->
            <div class="space-y-4 my-auto">
                
                <!-- TV EN VIVO -->
                <button onclick="navigateTo('screen-servers')" class="w-full app-card pulse-glow p-4 flex items-center justify-start space-x-6 hover:bg-zinc-900 transition">
                    <div class="w-12 h-12 rounded-xl bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-2xl text-cyan-400 shadow-inner">
                        📺
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide uppercase">TV EN VIVO</span>
                </button>

                <!-- PELÍCULAS ESTRENO -->
                <button onclick="showToast('Sección de Películas Estreno')" class="w-full app-card p-4 flex items-center justify-start space-x-6 hover:bg-zinc-900 transition">
                    <div class="w-12 h-12 rounded-xl bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-2xl">
                        🎬
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide uppercase">PELÍCULAS ESTRENO</span>
                </button>

                <!-- PELÍCULAS PLUS -->
                <button onclick="showToast('Sección de Películas Plus')" class="w-full app-card p-4 flex items-center justify-start space-x-6 hover:bg-zinc-900 transition">
                    <div class="w-12 h-12 rounded-xl bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-2xl">
                        🎥
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide uppercase">PELÍCULAS PLUS</span>
                </button>

                <!-- PELÍCULAS COLECCIÓN -->
                <button onclick="showToast('Sección de Películas Colección')" class="w-full app-card p-4 flex items-center justify-start space-x-6 hover:bg-zinc-900 transition">
                    <div class="w-12 h-12 rounded-xl bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-2xl">
                        🎞️
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide uppercase">PELÍCULAS COLECCIÓN</span>
                </button>

                <!-- SERIES -->
                <button onclick="showToast('Sección de Series')" class="w-full app-card p-4 flex items-center justify-start space-x-6 hover:bg-zinc-900 transition">
                    <div class="w-12 h-12 rounded-xl bg-zinc-900/80 border border-zinc-700/50 flex items-center justify-center text-2xl">
                        🎭
                    </div>
                    <span class="text-lg font-bold text-white tracking-wide uppercase">SERIES</span>
                </button>

            </div>

            <!-- Footer -->
            <div class="text-center py-2">
                <span class="text-[10px] text-zinc-600 font-mono tracking-widest uppercase">RAYKO PLAY FREEMIUM © 2026</span>
            </div>
        </div>

        <!-- VISTA 2: SERVIDORES TV -->
        <div id="screen-servers" class="screen flex-col flex-1 px-5 py-4 justify-between overflow-y-auto">
            <!-- Header Logo -->
            <div class="text-center my-6">
                <h1 class="text-3xl font-black tracking-wider text-white">
                    SERVIDORES<span class="text-red-600 drop-shadow-[0_0_12px_rgba(255,0,43,0.9)]">TV</span>
                </h1>
                <p class="text-xs text-gray-400 font-mono tracking-[0.3em] mt-2 uppercase">
                    RAYKO PLAY FREEMIUM
                </p>
            </div>

            <!-- Lista de Servidores -->
            <div class="space-y-5 my-auto">
                
                <!-- TV FREEMIUM 1 (SOLO ESTE CARGARÁ LOS CANALES) -->
                <button onclick="loadServerChannels()" class="w-full app-card pulse-glow p-4 flex items-center justify-center space-x-4 hover:bg-zinc-900 transition">
                    <span class="text-2xl">📺</span>
                    <span class="text-lg font-extrabold text-white tracking-wider uppercase">TV FREEMIUM 1</span>
                </button>

                <!-- TV FREEMIUM 2 (Sin funcionalidad) -->
                <button onclick="showToast('Servidor 2 en mantenimiento')" class="w-full app-card p-4 flex items-center justify-center space-x-4 hover:bg-zinc-900 transition">
                    <span class="text-2xl">📺</span>
                    <span class="text-lg font-extrabold text-white tracking-wider uppercase">TV FREEMIUM 2</span>
                </button>

                <!-- TV FREEMIUM 3 (Sin funcionalidad) -->
                <button onclick="showToast('Servidor 3 en mantenimiento')" class="w-full app-card p-4 flex items-center justify-center space-x-4 hover:bg-zinc-900 transition">
                    <span class="text-2xl">📺</span>
                    <span class="text-lg font-extrabold text-white tracking-wider uppercase">TV FREEMIUM 3</span>
                </button>

            </div>

            <!-- Footer -->
            <div class="text-center py-4">
                <span class="text-xs text-zinc-500 font-mono tracking-widest uppercase">RAYKO PLAY © 2026</span>
            </div>
        </div>

        <!-- VISTA 3: PARRILLA DE CANALES -->
        <div id="screen-channels" class="screen flex-col flex-1 px-4 py-3 overflow-y-auto">
            
            <div class="text-center mb-3">
                <h2 class="text-xl font-bold text-white tracking-wide">CANALES DISPONIBLES</h2>
                <p class="text-[11px] text-red-500 font-semibold uppercase tracking-wider">Servidor Freemium Activo</p>
            </div>

            <!-- BUSCADOR DE CANALES -->
            <div class="relative mb-4">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <i class="fas fa-search text-sm"></i>
                </div>
                <input 
                    type="text" 
                    id="channel-search" 
                    oninput="filterChannels()" 
                    placeholder="Buscar canal..." 
                    class="w-full bg-zinc-900 border border-zinc-700 text-white placeholder-gray-500 text-sm rounded-full pl-9 pr-8 py-2.5 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition"
                >
                <button id="clear-search" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>

            <!-- Grid de Canales con Carga Automática de Logos -->
            <div id="channels-grid" class="grid grid-cols-2 gap-4 pb-6">
                <!-- Los canales se cargarán automáticamente desde la App -->
            </div>

            <!-- Mensaje cuando no se encuentran resultados -->
            <div id="no-results" class="hidden text-center py-10">
                <i class="fas fa-search-minus text-4xl text-gray-600 mb-3"></i>
                <p class="text-gray-400 text-sm">No se encontraron canales</p>
            </div>
        </div>

        <!-- TOAST / NOTIFICACIÓN -->
        <div id="toast" class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-zinc-800 border border-red-500/50 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
            <i class="fas fa-info-circle text-red-500"></i>
            <span id="toast-message">Mensaje</span>
        </div>

    </div>

    <!-- Script de Interacciones y Carga Automática de Canales -->
    <script>
        // 🟢 1. Array vacío para recibir los canales de la App
        let allChannels = [];

        // 🟢 2. Función que recibe los datos desde la App Java (MainActivity.java)
        function receiveChannelsFromApp(jsonData) {
            try {
                allChannels = JSON.parse(jsonData);
                console.log("Canales cargados desde la App: " + allChannels.length);
            } catch (e) {
                console.error("Error al parsear los canales", e);
            }
        }

        // 🟢 3. Función para cargar los canales en el grid (solo primer servidor)
        function loadServerChannels() {
            if (allChannels.length === 0) {
                showToast("Esperando datos de la App...");
                // Intentar pedir los datos si no llegaron solos
                if (window.Android) {
                    window.Android.sendChannelsToWeb();
                }
                return;
            }
            navigateTo('screen-channels');
            renderChannels();
        }

        // Función para renderizar los canales en la parrilla
        function renderChannels() {
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '';
            const noResults = document.getElementById('no-results');
            noResults.classList.add('hidden');

            if (allChannels.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 text-center py-10 text-gray-500 text-sm">
                        <i class="fas fa-satellite-dish text-3xl mb-3 block"></i>
                        No hay canales disponibles en este servidor.
                    </div>
                `;
                return;
            }

            allChannels.forEach(ch => {
                const card = document.createElement('div');
                card.className = "channel-card bg-white rounded-3xl p-3 flex flex-col items-center justify-between shadow-lg border-2 border-gray-200";
                card.setAttribute('data-name', ch.name.toLowerCase());

                // 🟢 4. LOGICA DEL LOGO: Si viene URL, se muestra. Si no, se usa el nombre.
                let logoHtml = '';
                if (ch.logoUrl && ch.logoUrl.trim() !== '') {
                    logoHtml = `<img src="${ch.logoUrl}" alt="${ch.name}" class="w-full h-full object-contain transition-transform duration-200 hover:scale-105" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'bg-black text-white font-bold text-center tracking-wider\\'>${ch.name}</div>'"/>`;
                } else {
                    logoHtml = `<div class="bg-black text-white font-black text-lg px-3 py-1.5 rounded-lg text-center tracking-wider uppercase">${ch.name}</div>`;
                }

                card.innerHTML = `
                    <div class="w-full h-24 flex items-center justify-center p-2 rounded-2xl bg-zinc-900 overflow-hidden relative">
                        ${logoHtml}
                    </div>
                    <button onclick="playChannel('${ch.name}')" class="w-full mt-2 bg-black hover:bg-zinc-800 text-white font-bold py-2 px-3 rounded-xl text-xs uppercase tracking-wider transition active:scale-95 shadow">
                        VER CANAL
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        // Función para el botón "VER CANAL"
        function playChannel(channelName) {
            showToast(`Cargando canal: ${channelName}`);
            if (window.Android) {
                window.Android.playChannelFromWeb(channelName);
            } else {
                console.log("Modo navegador: reproduciendo " + channelName);
            }
        }

        // Sistema de navegación interna
        const navigationHistory = ['screen-home'];

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function navigateTo(screenId) {
            const currentScreen = navigationHistory[navigationHistory.length - 1];
            if (currentScreen === screenId) return;

            document.getElementById(currentScreen).classList.remove('active');
            
            navigationHistory.push(screenId);
            const nextScreen = document.getElementById(screenId);
            nextScreen.classList.add('active');

            updateHeader();
        }

        function goBack() {
            if (navigationHistory.length <= 1) return;
            const currentScreen = navigationHistory.pop();
            document.getElementById(currentScreen).classList.remove('active');
            const previousScreen = navigationHistory[navigationHistory.length - 1];
            document.getElementById(previousScreen).classList.add('active');
            updateHeader();
        }

        function updateHeader() {
            const header = document.getElementById('nav-header');
            const titleSpan = document.getElementById('current-screen-title');
            const currentScreen = navigationHistory[navigationHistory.length - 1];

            if (currentScreen === 'screen-home') {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                if (currentScreen === 'screen-servers') {
                    titleSpan.textContent = 'Servidores';
                } else if (currentScreen === 'screen-channels') {
                    titleSpan.textContent = 'Parrilla TV';
                }
            }
        }

        function filterChannels() {
            const query = document.getElementById('channel-search').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.channel-card');
            const clearBtn = document.getElementById('clear-search');
            const noResults = document.getElementById('no-results');
            let visibleCount = 0;

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            cards.forEach(card => {
                const channelName = card.getAttribute('data-name');
                if (channelName.includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        function clearSearch() {
            const searchInput = document.getElementById('channel-search');
            searchInput.value = '';
            filterChannels();
            searchInput.focus();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 🟢 5. Carga inicial
        window.addEventListener('DOMContentLoaded', () => {
            // Si la App está presente, le pedimos los canales automáticamente
            if (window.Android) {
                window.Android.sendChannelsToWeb();
            }
        });
    </script>
</body>
</html>
